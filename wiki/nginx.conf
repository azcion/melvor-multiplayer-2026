server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    root /srv/current;
    index index.html;
    include /etc/nginx/mime.types;
    types { text/javascript mjs; }
    autoindex off;
    open_file_cache off;
    etag on;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://cdn.melvor.azcn.io; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    error_page 404 /wiki/404.html;
    location = /wiki { return 308 /wiki/$is_args$args; }
    location /wiki/ {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
    location / { return 404; }
}
