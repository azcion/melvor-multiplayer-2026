services:
  server:
    build:
      context: .
    environment:
      SERVER_PORT: "3000"
      DB_PATH: /app/data/melvor-multiplayer.sqlite
      CORS_ALLOWED_ORIGINS: ${MELVOR_CORS_ALLOWED_ORIGINS:-https://melvoridle.com,https://play.melvoridle.com,https://ios.melvoridle.com,https://android.melvoridle.com}
      TRUST_PROXY: ${MELVOR_TRUST_PROXY:-0}
      MAX_JSON_BODY_BYTES: ${MELVOR_MAX_JSON_BODY_BYTES:-32768}
      REQUEST_SOURCE_PER_MINUTE: ${MELVOR_REQUEST_SOURCE_PER_MINUTE:-120}
      REQUEST_SOURCE_BURST: ${MELVOR_REQUEST_SOURCE_BURST:-30}
      REQUEST_IDENTITY_PER_MINUTE: ${MELVOR_REQUEST_IDENTITY_PER_MINUTE:-60}
      REQUEST_IDENTITY_BURST: ${MELVOR_REQUEST_IDENTITY_BURST:-20}
      REGISTRATIONS_PER_SOURCE_HOUR: ${MELVOR_REGISTRATIONS_PER_SOURCE_HOUR:-4}
      REGISTRATIONS_PER_SERVICE_HOUR: ${MELVOR_REGISTRATIONS_PER_SERVICE_HOUR:-32}
      FILE_OPERATIONAL_LOGS: ${MELVOR_FILE_OPERATIONAL_LOGS:-0}
      LOG_DIR: /app/logs
      BACKUP_DIR: /app/backups
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports:
      - "127.0.0.1:${MELVOR_SERVER_PORT:-3000}:3000"
    volumes:
      - database-data:/app/data
      - ${MELVOR_BACKUP_DIR:-./backups}:/app/backups
      - ${MELVOR_LOG_DIR:-./logs}:/app/logs
    logging:
      driver: ${MELVOR_DOCKER_LOG_DRIVER:-local}
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
    environment:
      TEST_SERVER_URL: http://server:3000
      TEST_DB_PATH: /app/data/melvor-multiplayer.sqlite
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - database-data:/app/data
      - test-state:/test-state
    command: ["bun", "run", "test"]

volumes:
  database-data:
  test-state:
