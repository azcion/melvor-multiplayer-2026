<template id="template-mp-online-button">
	<div class="d-inline-block ml-1" id="mp-online-button-container" @click="state.toggle_online_dropdown()">
		<div class="mp-notification-circle" v-if="state.num_notifications > 0">
			{{ state.num_notifications }}
		</div>
		<button class="btn btn-sm btn-dual text-combat-smoke" id="mp-online-button">
			<img class="skill-icon-xxs" :src="state.get_svg('multiplayer')"/>
		</button>
	</div>
</template>
<template id="template-mp-dropdown">
	<div class="dropdown-menu dropdown-menu-right p-0 border-0 font-size-sm" id="mp-online-dropdown">
		<div class="p-2" v-if="state.is_connected">
			<h5 class="dropdown-header text-warning">
				<lang-string lang-id="MOD_MP_MENU_HEADER"></lang-string>
			</h5>
			<a class="dropdown-item pointer-enabled" @click.stop="state.show_display_name_modal()">
				<lang-string lang-id="MOD_MP_MENU_CHANGE_DISPLAY_NAME"></lang-string>
			</a>
			<a class="dropdown-item pointer-enabled" @click.stop="state.show_icon_modal()">
				<img class="skill-icon-xxs" :src="state.get_avatar_icon(state.profile_icon)"/>
				<lang-string lang-id="MOD_MP_MENU_CHANGE_ICON"></lang-string>
			</a>
			<h5 class="dropdown-header text-warning">
				<lang-string lang-id="MOD_MP_MENU_HEADER_GUILD"></lang-string>
			</h5>
			<a class="dropdown-item pointer-enabled" @click.stop="state.open_guild_page()">
				<lang-string lang-id="MOD_MP_MENU_VIEW_GUILD" v-if="state.is_guild_member"></lang-string>
				<lang-string lang-id="MOD_MP_MENU_VIEW_GUILD_APPLICATION" v-else-if="state.guild_state.affiliation === 'applicant'"></lang-string>
				<lang-string lang-id="MOD_MP_MENU_FIND_GUILD" v-else></lang-string>
				<span class="mp-menu-notification-number" v-if="state.num_guild_applicants > 0">{{ state.num_guild_applicants }}</span>
			</a>
			<h5 class="dropdown-header text-warning" v-if="state.has_transfer_access">
				<lang-string lang-id="MOD_MP_MENU_HEADER_TRADING"></lang-string>
			</h5>
			<a class="dropdown-item pointer-enabled" @click.stop="state.open_transfer_data_page()" v-if="state.has_transfer_access">
				<lang-string lang-id="MOD_MP_MENU_VIEW_TRADES"></lang-string>
				<span class="mp-menu-notification-number" v-if="state.num_transfer_offers > 0">{{ state.num_transfer_offers }}</span>
			</a>
			<h5 class="dropdown-header text-warning" v-if="state.is_guild_member">
				<lang-string lang-id="MOD_MP_MENU_HEADER_MARKET"></lang-string>
			</h5>
			<a class="dropdown-item pointer-enabled" @click.stop="state.open_market_page('listing')" v-if="state.is_guild_member">
				<lang-string lang-id="MOD_MP_MENU_VIEW_LISTING"></lang-string>
				<span class="mp-menu-notification-number" v-if="state.num_market_sold_items > 0">{{ state.num_market_sold_items }}</span>
			</a>
		</div>
		<div class="p-2" v-else>
			<h5 class="dropdown-header text-warning">
				<lang-string lang-id="MOD_MP_MENU_HEADER"></lang-string>
			</h5>
			<a class="dropdown-item" @click.stop="state.reconnect()">
				<lang-string lang-id="MOD_MP_MENU_RECONNECT"></lang-string>
			</a>
		</div>
	</div>
</template>
<template id="template-mp-leave-guild-modal">
	<div class="mp-modal-text">
		<lang-string lang-id="MOD_MP_GUILD_LEAVE_WARNING"></lang-string>
		<span id="mp-modal-error" class="d-none text-danger"></span>
	</div>
	<div class="mp-button-tray">
		<button type="button" class="btn btn-danger" @click="state.leave_guild($event)">
			<div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div>
			<lang-string lang-id="MOD_MP_BUTTON_LEAVE_GUILD"></lang-string>
		</button>
		<button type="button" class="btn btn-secondary" @click="state.close_modal()">
			<lang-string lang-id="MOD_MP_BUTTON_CANCEL"></lang-string>
		</button>
	</div>
</template>
<template id="template-mp-council-raise-modal">
	<div class="mp-modal-text"><lang-string lang-id="MOD_MP_COUNCIL_RAISE_INFO"></lang-string></div>
	<hr class="mp-council-modal-rule">
	<div class="mp-council-type-chooser">
		<div class="mp-council-type-action">
			<div><span class="font-w600"><lang-string lang-id="MOD_MP_COUNCIL_TYPE_APPELLATION"></lang-string></span><button type="button" class="btn btn-sm btn-primary" @click="state.show_council_petition_modal('appellation')"><lang-string lang-id="MOD_MP_COUNCIL_RAISE_ACTION"></lang-string></button></div>
			<em><lang-string lang-id="MOD_MP_COUNCIL_APPELLATION_DESCRIPTION"></lang-string></em>
		</div>
		<div class="mp-council-type-action">
			<div><span class="font-w600"><lang-string lang-id="MOD_MP_COUNCIL_TYPE_HERALDRY"></lang-string></span><button type="button" class="btn btn-sm btn-primary" @click="state.show_council_petition_modal('heraldry')"><lang-string lang-id="MOD_MP_COUNCIL_RAISE_ACTION"></lang-string></button></div>
			<em><lang-string lang-id="MOD_MP_COUNCIL_HERALDRY_DESCRIPTION"></lang-string></em>
		</div>
		<div class="mp-council-type-action">
			<div><span class="font-w600"><lang-string lang-id="MOD_MP_COUNCIL_TYPE_BANISHMENT"></lang-string></span><button type="button" class="btn btn-sm btn-danger" @click="state.show_council_petition_modal('banishment')"><lang-string lang-id="MOD_MP_COUNCIL_RAISE_ACTION"></lang-string></button></div>
			<em><lang-string lang-id="MOD_MP_COUNCIL_BANISHMENT_DESCRIPTION"></lang-string></em>
		</div>
	</div>
</template>
<template id="template-mp-council-appellation-modal">
	<div class="mp-council-petition-description"><em><lang-string lang-id="MOD_MP_COUNCIL_APPELLATION_DESCRIPTION"></lang-string></em></div>
	<hr class="mp-council-modal-rule">
	<label class="w-100 font-w600"><lang-string lang-id="MOD_MP_COUNCIL_PROPOSED_NAME"></lang-string>
		<input class="mp-input-text w-100 mt-1" type="text" maxlength="20" v-model="state.council_name_input">
	</label>
	<div class="text-danger mt-3" v-if="state.council_error">{{ state.council_error }}</div>
	<div class="mp-button-tray mt-3">
		<button type="button" class="btn btn-success" @click="state.submit_council_petition($event, 'appellation')"><div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div><lang-string lang-id="MOD_MP_COUNCIL_RAISE"></lang-string></button>
		<button type="button" class="btn btn-secondary" @click="state.close_modal()"><lang-string lang-id="MOD_MP_BUTTON_CANCEL"></lang-string></button>
	</div>
</template>
<template id="template-mp-council-heraldry-modal">
	<div class="mp-council-petition-description"><em><lang-string lang-id="MOD_MP_COUNCIL_HERALDRY_DESCRIPTION"></lang-string></em></div>
	<hr class="mp-council-modal-rule">
	<div class="font-w600 mb-1"><lang-string lang-id="MOD_MP_COUNCIL_PROPOSED_ICON"></lang-string></div>
	<input class="mp-input-text w-100" type="search" v-model="state.council_icon_search" placeholder="Search combat locations">
	<div class="mp-guild-icon-selector mt-2">
		<button type="button" class="bank-item no-bg btn-light pointer-enabled resize-48" :class="{ 'mp-icon-picked': icon.id === state.council_picked_icon }" v-for="icon in state.filtered_council_icons" @click="state.pick_council_icon(icon)"><img class="p-2 resize-48" :src="icon.media"></button>
	</div>
	<div class="text-danger mt-3" v-if="state.council_error">{{ state.council_error }}</div>
	<div class="mp-button-tray mt-3">
		<button type="button" class="btn btn-success" @click="state.submit_council_petition($event, 'heraldry')"><div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div><lang-string lang-id="MOD_MP_COUNCIL_RAISE"></lang-string></button>
		<button type="button" class="btn btn-secondary" @click="state.close_modal()"><lang-string lang-id="MOD_MP_BUTTON_CANCEL"></lang-string></button>
	</div>
</template>
<template id="template-mp-council-banishment-modal">
	<div class="mp-council-petition-description"><em><lang-string lang-id="MOD_MP_COUNCIL_BANISHMENT_DESCRIPTION"></lang-string></em></div>
	<hr class="mp-council-modal-rule">
	<div class="mp-council-target-list">
		<button type="button" class="btn btn-outline-danger mp-guild-person" v-for="member in state.guild_members" @click="state.submit_council_petition($event, 'banishment', member.client_id)"><div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div><img class="skill-icon-xs" :src="state.get_avatar_icon(member.icon_id)"><span>{{ member.display_name }}</span><span class="badge badge-info" v-if="member.client_id === state.guild_client_id"><lang-string lang-id="MOD_MP_GUILD_YOU"></lang-string></span></button>
	</div>
	<div class="text-danger mt-3" v-if="state.council_error">{{ state.council_error }}</div>
</template>
<template id="template-mp-banished-modal">
	<div class="mp-modal-text"><lang-string-f lang-id="MOD_MP_COUNCIL_BANISHED_INFO" :lang-arg-1="state.pending_banishment_guild_name"></lang-string-f></div>
	<button type="button" class="btn btn-primary" @click="state.close_modal()"><lang-string lang-id="MOD_MP_COUNCIL_ACKNOWLEDGE"></lang-string></button>
</template>
<template id="template-mp-guild-page">
	<div class="content d-none" id="mp-guild-page">
		<div class="mp-guild-page-layout">
			<template v-if="state.guild_state.affiliation === 'member'">
				<div class="block block-rounded block-link-pop border-top mp-guild-border border-4x">
					<div class="block-content mp-guild-summary">
						<img class="mp-guild-summary-icon" :src="state.get_guild_icon(state.guild_state.guild.icon_id)">
						<div>
							<div class="font-size-sm text-muted"><lang-string lang-id="MOD_MP_GUILD_YOUR_GUILD"></lang-string></div>
							<h3 class="font-w600 mb-1">{{ state.guild_state.guild.name }}</h3>
							<lang-string-f lang-id="MOD_MP_GUILD_MEMBER_COUNT" :lang-arg-1="state.guild_members.length"></lang-string-f>
						</div>
					</div>
				</div>

				<div class="mp-guild-columns">
					<div class="block block-rounded">
						<div class="block-header block-header-default">
							<h3 class="block-title"><lang-string lang-id="MOD_MP_GUILD_MEMBERS"></lang-string></h3>
							<span class="badge badge-secondary">{{ state.guild_members.length }}</span>
						</div>
						<div class="block-content p-0">
							<div class="mp-guild-person" v-for="member in state.guild_members">
								<img class="skill-icon-xs" :src="state.get_avatar_icon(member.icon_id)">
								<span class="font-w600">{{ member.display_name }}</span>
								<span class="badge badge-info ml-auto" v-if="member.client_id === state.guild_client_id">
									<lang-string lang-id="MOD_MP_GUILD_YOU"></lang-string>
								</span>
							</div>
						</div>
					</div>

					<div class="block block-rounded">
						<div class="block-header block-header-default">
							<h3 class="block-title"><lang-string lang-id="MOD_MP_GUILD_APPLICANTS"></lang-string></h3>
							<span class="badge badge-success">{{ state.guild_applicants.length }}</span>
						</div>
						<div class="block-content p-0" v-if="state.guild_applicants.length > 0">
							<div class="mp-guild-person mp-guild-applicant" v-for="application in state.guild_applicants">
								<img class="skill-icon-xs" :src="state.get_avatar_icon(application.icon_id)">
								<span class="font-w600">{{ application.display_name }}</span>
								<div class="mp-guild-person-actions">
									<button type="button" class="btn btn-sm btn-success" @click="state.decide_guild_application($event, application, true)">
										<div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div>
										<lang-string lang-id="MOD_MP_BUTTON_APPROVE"></lang-string>
									</button>
									<button type="button" class="btn btn-sm btn-danger" @click="state.decide_guild_application($event, application, false)">
										<div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div>
										<lang-string lang-id="MOD_MP_BUTTON_REJECT"></lang-string>
									</button>
								</div>
							</div>
						</div>
						<div class="block-content text-muted" v-else>
							<lang-string lang-id="MOD_MP_MODAL_NO_GUILD_APPLICANTS"></lang-string>
						</div>
					</div>
				</div>

				<div class="block block-rounded mp-council">
					<div class="block-header block-header-default">
						<h3 class="block-title"><lang-string lang-id="MOD_MP_COUNCIL"></lang-string></h3>
						<div class="mp-council-header-actions">
							<button type="button" class="btn btn-sm btn-secondary" v-if="state.has_resolved_council_petitions" :aria-pressed="state.council_show_resolved" @click="state.toggle_resolved_council_petitions()"><i class="fa" :class="state.council_show_resolved ? 'fa-eye-slash' : 'fa-eye'"></i><span class="sr-only"><lang-string lang-id="MOD_MP_COUNCIL_TOGGLE_HISTORY"></lang-string></span></button>
							<button type="button" class="btn btn-sm btn-primary" @click="state.show_raise_petition_modal()"><lang-string lang-id="MOD_MP_COUNCIL_RAISE"></lang-string></button>
						</div>
					</div>
					<div class="block-content" v-if="state.council_loading && state.council_petitions.length === 0"><lang-string lang-id="MOD_MP_COUNCIL_LOADING"></lang-string></div>
					<div class="block-content text-muted" v-else-if="state.visible_council_petitions.length === 0"><lang-string lang-id="MOD_MP_COUNCIL_EMPTY"></lang-string></div>
					<div class="mp-council-list" v-else>
						<div class="mp-council-card" v-for="petition in state.visible_council_petitions" :key="petition.petition_id">
							<div class="mp-council-card-header"><span class="font-w600">{{ state.get_council_type_lang(petition.type) }}</span><span class="mp-council-card-badges"><span class="badge" :class="petition.current_vote === 'aye' ? 'badge-success' : 'badge-danger'" v-if="petition.current_vote">{{ state.get_council_choice_lang(petition.current_vote) }}</span><span class="badge" :class="petition.lifecycle === 'active' ? 'badge-info' : petition.lifecycle === 'granted' ? 'badge-success' : 'badge-secondary'">{{ state.get_council_outcome_lang(petition.lifecycle) }}</span></span></div>
							<div class="mp-council-proposal" v-if="petition.type === 'appellation'">{{ petition.proposal.name }}</div>
							<div class="mp-council-proposal" v-else-if="petition.type === 'heraldry'"><img class="skill-icon-xs" :src="state.get_guild_icon(petition.proposal.icon_id)"></div>
							<div class="mp-council-proposal mp-guild-person" v-else><img class="skill-icon-xs" :src="state.get_avatar_icon(petition.proposal.target.icon_id)"><span>{{ petition.proposal.target.display_name }}</span></div>
							<div class="font-size-sm text-warning" v-if="petition.lifecycle === 'granted' && ['pending', 'running', 'failed'].includes(petition.execution_state)">{{ state.get_council_execution_lang(petition.execution_state) }}</div>
							<div class="mp-council-tally" v-if="petition.tally_visible"><div class="mp-council-tally-aye" :style="{ width: state.get_council_tally_width(petition, 'aye') }"></div><div class="mp-council-tally-nay" :style="{ width: state.get_council_tally_width(petition, 'nay') }"></div><div class="mp-council-tally-uncast" :style="{ width: state.get_council_tally_width(petition, 'uncast') }"></div><span class="mp-council-threshold"></span></div>
							<div class="font-size-sm text-muted" v-else><lang-string lang-id="MOD_MP_COUNCIL_TALLY_HIDDEN"></lang-string></div>
							<div class="mp-council-actions" v-if="petition.can_vote"><button type="button" class="btn btn-sm btn-success" @click="state.vote_council_petition($event, petition, 'aye')"><div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div><lang-string lang-id="MOD_MP_COUNCIL_AYE"></lang-string></button><button type="button" class="btn btn-sm btn-danger" @click="state.vote_council_petition($event, petition, 'nay')"><div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div><lang-string lang-id="MOD_MP_COUNCIL_NAY"></lang-string></button></div>
							<button type="button" class="btn btn-sm btn-outline-danger mt-2" v-if="petition.can_withdraw" @click="state.withdraw_council_petition($event, petition)"><div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div><lang-string lang-id="MOD_MP_COUNCIL_WITHDRAW"></lang-string></button>
						</div>
					</div>
					<div class="block-content text-center" v-if="state.council_show_resolved && state.council_has_more"><button type="button" class="btn btn-sm btn-secondary" @click="state.load_more_council_petitions($event)"><div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div><lang-string lang-id="MOD_MP_COUNCIL_LOAD_MORE"></lang-string></button></div>
				</div>

				<div class="block block-rounded mp-guild-danger-zone">
					<div class="block-content mp-guild-danger-content">
						<div>
							<div class="font-size-sm font-w600 text-danger text-uppercase">
								<lang-string lang-id="MOD_MP_GUILD_DANGER_ZONE"></lang-string>
							</div>
							<h4 class="mb-1"><lang-string lang-id="MOD_MP_GUILD_LEAVE_TITLE"></lang-string></h4>
							<div class="font-size-sm text-muted"><lang-string lang-id="MOD_MP_GUILD_LEAVE_INFO"></lang-string></div>
						</div>
						<button type="button" class="btn btn-danger" @click="state.confirm_leave_guild()">
							<lang-string lang-id="MOD_MP_BUTTON_LEAVE_GUILD"></lang-string>
						</button>
					</div>
				</div>
			</template>

			<template v-else-if="state.guild_state.affiliation === 'applicant'">
				<div class="block block-rounded block-link-pop border-top mp-guild-border border-4x">
					<div class="block-content mp-guild-application">
						<img class="mp-guild-summary-icon" :src="state.get_guild_icon(state.guild_state.application.icon_id)">
						<div>
							<div class="font-size-sm text-warning"><lang-string lang-id="MOD_MP_TITLE_GUILD_APPLICATION"></lang-string></div>
							<h3 class="font-w600 mb-1">{{ state.guild_state.application.name }}</h3>
							<p class="mb-2"><lang-string lang-id="MOD_MP_GUILD_APPLICATION_PENDING"></lang-string></p>
							<span class="badge badge-secondary">
								<lang-string-f lang-id="MOD_MP_GUILD_MEMBER_COUNT" :lang-arg-1="state.guild_state.application.member_count"></lang-string-f>
							</span>
						</div>
					</div>
				</div>

				<div class="block block-rounded mp-guild-danger-zone">
					<div class="block-content mp-guild-danger-content">
						<div>
							<div class="font-size-sm font-w600 text-danger text-uppercase">
								<lang-string lang-id="MOD_MP_GUILD_DANGER_ZONE"></lang-string>
							</div>
							<h4 class="mb-1"><lang-string lang-id="MOD_MP_GUILD_WITHDRAW_TITLE"></lang-string></h4>
							<div class="font-size-sm text-muted"><lang-string lang-id="MOD_MP_GUILD_WITHDRAW_INFO"></lang-string></div>
						</div>
						<button type="button" class="btn btn-danger" @click="state.withdraw_guild_application($event)">
							<div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div>
							<lang-string lang-id="MOD_MP_BUTTON_WITHDRAW"></lang-string>
						</button>
					</div>
				</div>
			</template>

			<div class="mp-guild-onboarding" v-else>
				<div class="block block-rounded">
					<div class="block-header block-header-default">
						<div>
							<div class="font-size-sm text-muted"><lang-string lang-id="MOD_MP_GUILD_DISCOVER"></lang-string></div>
							<h3 class="block-title"><lang-string lang-id="MOD_MP_MENU_FIND_GUILD"></lang-string></h3>
						</div>
					</div>
					<div class="block-content">
						<input class="mp-input-text w-100 mb-3" type="search" v-model="state.guild_list_search" placeholder="Search guilds by name">
						<div class="mp-guild-list" v-if="state.filtered_guilds.length > 0">
							<div class="mp-guild-result" v-for="guild in state.filtered_guilds">
								<img class="skill-icon-xs" :src="state.get_guild_icon(guild.icon_id)">
								<span class="font-w600">{{ guild.name }}</span>
								<span class="badge badge-secondary">
									<lang-string-f lang-id="MOD_MP_GUILD_MEMBER_COUNT" :lang-arg-1="guild.member_count"></lang-string-f>
								</span>
								<button type="button" class="btn btn-sm btn-success" @click="state.apply_to_guild($event, guild)">
									<div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div>
									<lang-string lang-id="MOD_MP_BUTTON_APPLY"></lang-string>
								</button>
							</div>
						</div>
						<div class="text-muted" v-else>
							<lang-string lang-id="MOD_MP_MODAL_NO_GUILDS" v-if="state.guild_list_search.length === 0"></lang-string>
							<lang-string lang-id="MOD_MP_MODAL_NO_GUILD_MATCHES" v-else></lang-string>
						</div>
					</div>
				</div>

				<div class="block block-rounded">
					<div class="block-header block-header-default">
						<div>
							<div class="font-size-sm text-muted"><lang-string lang-id="MOD_MP_GUILD_START_FRESH"></lang-string></div>
							<h3 class="block-title"><lang-string lang-id="MOD_MP_TITLE_CREATE_GUILD"></lang-string></h3>
						</div>
					</div>
					<div class="block-content">
						<p><lang-string lang-id="MOD_MP_MODAL_DESC_CREATE_GUILD"></lang-string></p>
						<label class="w-100 font-w600">
							<lang-string lang-id="MOD_MP_LABEL_GUILD_NAME"></lang-string>
							<input class="mp-input-text w-100 mt-1" type="text" maxlength="20" v-model="state.guild_name_input">
						</label>
						<input class="mp-input-text w-100 mt-3" type="search" v-model="state.guild_icon_search" placeholder="Search combat locations">

										<small class="badge-pill bg-secondary">{{ formatNumber(item.qty) }}</small>
									</div>
								</a>
							</mp-item-icon>
						</div>
					</div>
					<div class="p-3 mp-transfer-buttons">
						<button type="button" class="btn btn-success m-1" @click="state.resolve_trade($event, trade.trade_id)" :key="trade.trade_id">
							<div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div>
							<lang-string lang-id="MOD_MP_BUTTON_TAKE_ITEMS"></lang-string>
						</button>
					</div>
				</div>
				<div class="block tabbable w-100 mp-col" v-else>
					<div class="p-4">
						<lang-string lang-id="MOD_MP_TRANSFER_LOADING_TRADE"></lang-string>
					</div>
				</div>
			</template>
			<template v-for="trade in state.sorted_trades">
				<div class="block tabbable w-100 mp-col" v-if="!!trade.data">
					<div class="pl-3 pt-1 pb-1 bg-dark-bank-info text-center">
						<div class="row gutters-tiny">
							<div class="col-6 col-lg-3">
								<span class="font-w400 font-size-sm mb-0">
									<span class="font-w600">
										<img class="skill-icon-xs" :src="state.get_avatar_icon(trade.data.other_player.icon_id)"/>
										<lang-string-f lang-id="MOD_MP_TRANSFER_TRADE_FROM" :lang-arg-1="trade.data.other_player.display_name" v-if="trade.attending"></lang-string-f>
										<lang-string-f lang-id="MOD_MP_TRANSFER_TRADE_SENT" :lang-arg-1="trade.data.other_player.display_name" v-else></lang-string-f>
									</span>
								</span>
							</div>
							<div class="col-6 col-lg-3" v-if="trade.state === 0">
								<span class="font-w400 font-size-sm mb-0 ml-3">
									<span class="font-w600">
										<lang-string lang-id="MOD_MP_TRANSFER_VALUE"></lang-string>
										<span>
											<span class="mr-2">
												<img class="skill-icon-xxs mr-1" src="assets/media/main/coins.svg">
												<span class="font-w400">{{ state.get_transfer_value(trade) }}</span>
											</span>
										</span>
									</span>
								</span>
							</div>
						</div>
					</div>
					<div class="block-content">
						<div class="pb-4 mp-dual-trade" v-if="trade.state === 1">
							<div class="mp-dual-trade-panel">
								<div class="mp-dual-trade-header">
									<h5>
										<img class="skill-icon-xs" :src="state.get_avatar_icon(state.profile_icon)"/>
										<lang-string lang-id="MOD_MP_TRANSFER_HEADER_HOME"></lang-string>
									</h5>
									<span class="font-w600">
										<lang-string lang-id="MOD_MP_TRANSFER_VALUE"></lang-string>
										<span>
											<span class="mr-2">
												<img class="skill-icon-xxs mr-1" src="assets/media/main/coins.svg">
												<span class="font-w400">{{ state.get_trade_items_value(state.filter_trade_items_home(trade)) }}</span>
											</span>
										</span>
									</span>
								</div>
								<div class="mp-dual-trade-items">
									<mp-item-icon v-for="item of state.filter_trade_items_home(trade)" class="bank-item pointer-enabled m-2" :data-item-id="item.item_id" :key="item.item_id">
										<a role="button">
											<img class="bank-img p-3" :src="state.get_item_icon(item.item_id)">
											<div class="font-size-sm text-white text-center in-bank">
												<small class="badge-pill bg-secondary">{{ formatNumber(item.qty) }}</small>
											</div>
										</a>
									</mp-item-icon>
								</div>
							</div>
							<div class="mp-dual-trade-divider"></div>
							<div class="mp-dual-trade-panel">
								<div class="mp-dual-trade-header">
									<h5>
										<img class="skill-icon-xs" :src="state.get_avatar_icon(trade.data.other_player.icon_id)"/>
										<lang-string-f lang-id="MOD_MP_TRANSFER_HEADER_AWAY" :lang-arg-1="trade.data.other_player.display_name"></lang-string-f>
									</h5>
									<span class="font-w600">
										<lang-string lang-id="MOD_MP_TRANSFER_VALUE"></lang-string>
										<span>
											<span class="mr-2">
												<img class="skill-icon-xxs mr-1" src="assets/media/main/coins.svg">
												<span class="font-w400">{{ state.get_trade_items_value(state.filter_trade_items_away(trade)) }}</span>
											</span>
										</span>
									</span>
								</div>
								<div class="mp-dual-trade-items">
									<mp-item-icon v-for="item of state.filter_trade_items_away(trade)" class="bank-item pointer-enabled m-2" :data-item-id="item.item_id" :key="item.item_id">
										<a role="button">
											<img class="bank-img p-3" :src="state.get_item_icon(item.item_id)">
											<div class="font-size-sm text-white text-center in-bank">
												<small class="badge-pill bg-secondary">{{ formatNumber(item.qty) }}</small>
											</div>
										</a>
									</mp-item-icon>
								</div>
							</div>
						</div>
						<div class="pb-4 row" v-else>
							<mp-item-icon v-for="item of trade.data.items" class="bank-item pointer-enabled m-2" :data-item-id="item.item_id" :key="item.item_id">
								<a role="button">
									<img class="bank-img p-3" :src="state.get_item_icon(item.item_id)">
									<div class="font-size-sm text-white text-center in-bank">
										<small class="badge-pill bg-secondary">{{ formatNumber(item.qty) }}</small>
									</div>
								</a>
							</mp-item-icon>
						</div>
					</div>
					<div class="p-3 mp-transfer-buttons">
						<template v-if="trade.attending">
							<button v-if="trade.state === 0" type="button" class="btn btn-success m-1" @click="state.counter_trade($event, trade.trade_id)" :key="trade.trade_id">
								<div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div>
								<lang-string-f lang-id="MOD_MP_BUTTON_COUNTER_TRADE" :lang-arg-1="state.transfer_inventory.length"></lang-string-f>
							</button>
							<button v-else-if="trade.state === 1" type="button" class="btn btn-success m-1" @click="state.accept_trade($event, trade.trade_id)" :key="trade.trade_id">
								<div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div>
								<lang-string lang-id="MOD_MP_BUTTON_ACCEPT_TRADE"></lang-string>
							</button>
							<button type="button" class="btn btn-danger m-1" @click="state.decline_trade($event, trade.trade_id)" :key="trade.trade_id">
								<div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div>
								<lang-string lang-id="MOD_MP_BUTTON_DECLINE_TRADE"></lang-string>
							</button>
						</template>
						<template v-else>
							<button type="button" class="btn btn-danger m-1" @click="state.cancel_trade($event, trade.trade_id)" :key="trade.trade_id">
								<div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div>
								<lang-string lang-id="MOD_MP_BUTTON_CANCEL_TRADE"></lang-string>
							</button>
						</template>
					</div>
				</div>
				<div class="block tabbable w-100 mp-col" v-else>
					<div class="p-4">
						<lang-string lang-id="MOD_MP_TRANSFER_LOADING_TRADE"></lang-string>
					</div>
				</div>
			</template>
		</div>
		</div>
	</div>
</template>
<template id="template-mp-gift-friend-modal">
	<div class="mp-friends" v-if="state.guild_recipients.length > 0">
		<div v-for="recipient in state.guild_recipients" class="mp-friend">
			<img class="skill-icon-xs" :src="state.get_avatar_icon(recipient.icon_id)"/>
			<span>{{ recipient.display_name }}</span>
			<button type="button" class="btn btn-success" @click="state.select_gift_recipient(recipient)">
				<lang-string lang-id="MOD_MP_BUTTON_SELECT"></lang-string>

		</div>
	</div>
	<div class="mp-modal-text" v-else>
		<lang-string lang-id="MOD_MP_MODAL_NO_GUILD_RECIPIENTS"></lang-string>

	<button type="button" class="btn btn-danger" @click="state.close_modal()">

	</button>
</template>

		<lang-string lang-id="MOD_MP_MODAL_NO_GUILD_RECIPIENTS"></lang-string>

	<div class="mp-modal-text">
		<lang-string-f lang-id="MOD_MP_MODAL_DESC_CONFIRM_GIFT" :lang-arg-1="state.gifting_recipient.display_name"></lang-string-f>
		<lang-string lang-id="MOD_MP_MODAL_DESC_GIFT_VALUE"></lang-string>
		<span class="mr-2">
			<img class="skill-icon-xxs mr-1" src="assets/media/main/coins.svg">
			<span class="font-w400">{{ state.transfer_inventory_value }}</span>
		</span>
	</div>
	<button type="button" class="btn btn-success" @click="state.confirm_gift($event)">
		<div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div>
		<lang-string lang-id="MOD_MP_BUTTON_SEND_GIFT"></lang-string>
