<template id="template-mp-account-options">
	<div id="mp-account-options">
		<template v-if="state.is_connected">
			<h5 class="dropdown-header text-warning">
				<lang-string lang-id="MOD_MP_MENU_HEADER"></lang-string>
			</h5>
			<a class="dropdown-item pointer-enabled" @click.stop="state.show_options_modal()">
				<img class="skill-icon-xxs" :src="state.get_avatar_icon(state.profile_icon)"/>
				<lang-string lang-id="MOD_MP_MENU_OPTIONS"></lang-string>
			</a>
		</template>
	</div>
</template>
<template id="template-mp-social-mode-choice-modal">
	<div class="mp-social-mode-choice">
		<div class="mp-social-mode-subtitle"><lang-string :lang-id="state.social_mode_enforcement ? 'MOD_MP_SOCIAL_MODE_ENFORCED_INFO' : 'MOD_MP_SOCIAL_MODE_SUBTITLE'"></lang-string></div>
		<div class="mp-social-mode-options">
			<div class="mp-social-mode-card mp-social-mode-card-full" v-if="!state.social_mode_enforcement">
				<h3><lang-string lang-id="MOD_MP_SOCIAL_MODE_FULL"></lang-string></h3>
				<div class="mp-social-mode-description">
					<div><lang-string lang-id="MOD_MP_SOCIAL_MODE_FULL_INFO"></lang-string></div>
					<div><lang-string lang-id="MOD_MP_SOCIAL_MODE_FULL_DETAIL"></lang-string></div>
				</div>
				<button type="button" class="btn mp-social-mode-button" @click="state.choose_social_mode('full')">
					<lang-string lang-id="MOD_MP_SOCIAL_MODE_CHOOSE"></lang-string>
				</button>
			</div>
			<div class="mp-social-mode-card mp-social-mode-card-social">
				<h3><lang-string lang-id="MOD_MP_SOCIAL_MODE_SOCIAL"></lang-string></h3>
				<div class="mp-social-mode-description">
					<div><lang-string lang-id="MOD_MP_SOCIAL_MODE_SOCIAL_INFO"></lang-string></div>
					<div><lang-string lang-id="MOD_MP_SOCIAL_MODE_SOCIAL_DETAIL"></lang-string></div>
				</div>
				<button type="button" class="btn mp-social-mode-button" @click="state.choose_social_mode('social')">
					<lang-string lang-id="MOD_MP_SOCIAL_MODE_CHOOSE"></lang-string>
				</button>
			</div>
		</div>
	</div>
</template>
<template id="template-mp-expedition-page">
	<div class="content d-none" id="mp-expedition-page">
		<section class="mp-expedition-shell" :aria-label="getLangString('MOD_MP_PAGE_EXPEDITION')">
			<div class="mp-expedition-tabs" role="tablist" :aria-label="getLangString('MOD_MP_EXPEDITION_VIEWS')">
				<button type="button" class="mp-expedition-button" role="tab" id="mp-expedition-chamber-tab" aria-controls="mp-expedition-chamber-view" :aria-selected="state.expedition_mobile_tab === 'chamber'" :class="{ 'mp-expedition-button-secondary': state.expedition_mobile_tab !== 'chamber' }" @click="state.expedition_mobile_tab = 'chamber'"><lang-string lang-id="MOD_MP_EXPEDITION_UI_CHAMBER"></lang-string></button>
				<button type="button" class="mp-expedition-button" role="tab" id="mp-expedition-journey-tab" aria-controls="mp-expedition-journey-view" :aria-selected="state.expedition_mobile_tab === 'journey'" :class="{ 'mp-expedition-button-secondary': state.expedition_mobile_tab !== 'journey' }" @click="state.expedition_mobile_tab = 'journey'"><lang-string lang-id="MOD_MP_EXPEDITION_UI_JOURNEY"></lang-string></button>
			</div>
			<p class="mp-expedition-message" v-if="state.expedition_loading && !state.expedition_state && !state.expedition_personal"><lang-string lang-id="MOD_MP_EXPEDITION_UI_LOADING_EXPEDITION"></lang-string></p>
			<div class="mp-expedition-panel mp-expedition-notice" v-if="state.expedition_pending_report">
				<p><lang-string lang-id="MOD_MP_EXPEDITION_UI_A_WORK_REPORT_IS_WAITING_FOR_SERVER_CONFIRMATION_THE_EXACT_CAPTURED_REPORT_"></lang-string></p>
				<button type="button" class="mp-expedition-button" :disabled="state.expedition_action_pending" @click="state.retry_expedition_report()"><lang-string lang-id="MOD_MP_EXPEDITION_UI_RETRY_SAVED_REPORT"></lang-string></button>
			</div>
			<div class="mp-expedition-panel mp-expedition-notice" v-if="!state.expedition_pending_report && (state.expedition_state?.tracking?.pending_boundary_at || state.expedition_personal?.tracking?.pending_boundary_at)">
				<p><lang-string lang-id="MOD_MP_EXPEDITION_UI_THE_ORIGINAL_WORK_INTERVAL_IS_AWAITING_A_BOUNDARY_SNAPSHOT_TRACKING_ACTIONS"></lang-string></p>
			</div>
			<div id="mp-expedition-chamber-view" :class="{ 'mp-expedition-mobile-hidden': state.expedition_mobile_tab !== 'chamber' }" aria-labelledby="mp-expedition-chamber-tab">
				<div class="mp-expedition-panel" v-if="state.expedition_state && !state.expedition_state?.expedition">
					<p><lang-string lang-id="MOD_MP_EXPEDITION_UI_NO_EXPEDITION_IS_ACTIVE_IN_THIS_GUILD"></lang-string></p>
					<button type="button" class="mp-expedition-button" :disabled="state.expedition_action_pending" @click="state.register_expedition()"><lang-string lang-id="MOD_MP_EXPEDITION_UI_START_AND_REGISTER"></lang-string></button>
				</div>
				<div v-if="state.expedition_state?.expedition">
					<details class="mp-expedition-panel mp-expedition-snow-controls" v-if="state.expedition_snow_controls_enabled && (state.expedition_state?.expedition?.status === 'registration' || state.expedition_state?.expedition?.chamber?.id === 'entrance')">
						<summary><lang-string lang-id="MOD_MP_EXPEDITION_UI_RIFT_SNOW_SETTINGS"></lang-string></summary>
						<div class="mp-expedition-snow-fields">
							<label><lang-string lang-id="MOD_MP_EXPEDITION_UI_FLAKES"></lang-string> <output>{{ state.expedition_snow.count }}</output><input type="range" min="0" max="120" step="1" v-model.number="state.expedition_snow.count"></label>
							<label><lang-string lang-id="MOD_MP_EXPEDITION_UI_SPEED"></lang-string> <output>{{ state.expedition_snow.speed }} px/s</output><input type="range" min="0" max="150" step="5" v-model.number="state.expedition_snow.speed"></label>
							<label><lang-string lang-id="MOD_MP_EXPEDITION_UI_OPACITY"></lang-string> <output>{{ state.expedition_snow.opacity }}%</output><input type="range" min="0" max="100" step="1" v-model.number="state.expedition_snow.opacity"></label>
							<label><lang-string lang-id="MOD_MP_EXPEDITION_UI_SMALLEST"></lang-string> <output>{{ state.expedition_snow.min_size }} px</output><input type="range" min="0.5" :max="state.expedition_snow.max_size" step="0.5" v-model.number="state.expedition_snow.min_size"></label>
							<label><lang-string lang-id="MOD_MP_EXPEDITION_UI_LARGEST"></lang-string> <output>{{ state.expedition_snow.max_size }} px</output><input type="range" :min="state.expedition_snow.min_size" max="8" step="0.5" v-model.number="state.expedition_snow.max_size"></label>
							<label><lang-string lang-id="MOD_MP_EXPEDITION_UI_ANGLE"></lang-string> <output>{{ state.expedition_snow.angle }}°</output><input type="range" min="-60" max="60" step="5" v-model.number="state.expedition_snow.angle"></label>
						</div>
						<div class="mp-expedition-snow-meter" v-if="state.expedition_snow_stats">{{ state.expedition_text('MOD_MP_EXPEDITION_SNOW_FRAME_STATS', state.expedition_snow_stats.fps, state.expedition_snow_stats.draw_ms.toFixed(2)) }}</div>
						<div class="mp-expedition-snow-meter" v-else><lang-string lang-id="MOD_MP_EXPEDITION_UI_SNOW_PAUSED"></lang-string></div>
						<p><lang-string lang-id="MOD_MP_EXPEDITION_UI_FPS_MEASURES_THE_WHOLE_GAME_SNOW_DRAW_TIME_MEASURES_THIS_OVERLAY_COMPARE_SE"></lang-string></p>
						<button type="button" class="mp-expedition-button mp-expedition-button-secondary" @click="state.reset_expedition_snow()"><lang-string lang-id="MOD_MP_EXPEDITION_UI_RESET_SNOW"></lang-string></button>
					</details>
					<div class="mp-expedition-panel mp-expedition-chamber-card" v-if="state.expedition_state?.expedition?.status === 'registration'">
						<div class="mp-expedition-chamber-art-frame mp-expedition-rift-snow" aria-hidden="true">
							<img class="mp-expedition-chamber-art" data-chamber-id="entrance" :src="state.expedition_chamber_art_url('entrance')" alt="" />
							<mp-expedition-snow></mp-expedition-snow>
						</div>
						<h1 class="mp-expedition-chamber-title"><lang-string lang-id="MOD_MP_EXPEDITION_UI_THE_RIFT"></lang-string></h1>
						<div class="mp-expedition-chamber-copy">
							<p><lang-string lang-id="MOD_MP_EXPEDITION_UI_GATHERING_FOR_THE_EXPEDITION"></lang-string></p>
							<p><strong>{{ state.expedition_state?.expedition?.registered_count }}</strong> <lang-string lang-id="MOD_MP_EXPEDITION_UI_REGISTERED"></lang-string></p>
							<p class="mp-expedition-points"><lang-string lang-id="MOD_MP_EXPEDITION_UI_YOUR_EP"></lang-string> <strong>{{ state.expedition_points(state.expedition_state?.points_micros) }}</strong></p>
							<label class="mp-expedition-work-prompts-toggle"><input type="checkbox" :checked="state.expedition_work_prompts_enabled" @change="state.set_expedition_work_prompts($event)"><lang-string lang-id="MOD_MP_EXPEDITION_WORK_PROMPTS_TOGGLE"></lang-string></label>
						</div>
					</div>
					<div class="mp-expedition-registration" v-if="state.expedition_state?.expedition?.status === 'registration'">
						<div class="mp-expedition-panel">
							<h3><lang-string lang-id="MOD_MP_EXPEDITION_UI_REGISTRATION"></lang-string></h3>
							<p>{{ state.expedition_text('MOD_MP_EXPEDITION_REGISTRATION_CLOSES_IN', state.expedition_time_remaining(state.expedition_state?.expedition?.registration_ends_at)) }}</p>
							<button type="button" class="mp-expedition-button" v-if="!state.expedition_state?.expedition?.registered" :disabled="state.expedition_action_pending" @click="state.register_expedition()"><lang-string lang-id="MOD_MP_EXPEDITION_UI_REGISTER_FOR_THIS_EXPEDITION"></lang-string></button>
							<p v-else><lang-string lang-id="MOD_MP_EXPEDITION_UI_YOU_ARE_REGISTERED"></lang-string></p>
						</div>
						<div class="mp-expedition-panel" v-if="state.expedition_state?.expedition?.registered && !state.is_social_only">
							<h3><lang-string lang-id="MOD_MP_EXPEDITION_UI_EXPEDITION_STASH"></lang-string></h3>
							<p><lang-string lang-id="MOD_MP_EXPEDITION_UI_CONTRIBUTE_FOOD_OR_POTIONS_WHILE_REGISTRATION_IS_OPEN"></lang-string></p>
							<p><lang-string lang-id="MOD_MP_EXPEDITION_UI_SUPPLIES_YOU_CONTRIBUTE_CAN_EARN_YOU_EXTRA_EP"></lang-string></p>
							<button type="button" class="mp-expedition-button" @click="state.show_expedition_supply_modal()"><lang-string lang-id="MOD_MP_EXPEDITION_UI_CHOOSE_SUPPLIES"></lang-string></button>
						</div>
					</div>
					<div class="mp-expedition-panel" v-if="['completed', 'inactive', 'dissolved'].includes(state.expedition_state?.expedition?.status)">
						<h3><lang-string lang-id="MOD_MP_EXPEDITION_UI_EXPEDITION_ENDED"></lang-string></h3>
						<p>{{ state.expedition_text('MOD_MP_EXPEDITION_STASH_OUTCOME', state.expedition_status('STASH', state.expedition_state?.expedition?.stash_outcome)) }}</p>
						<button type="button" class="mp-expedition-button" @click="state.register_expedition()"><lang-string lang-id="MOD_MP_EXPEDITION_UI_REGISTER_FOR_A_NEW_EXPEDITION"></lang-string></button>
					</div>
					<div class="mp-expedition-panel mp-expedition-notice" v-if="state.expedition_state?.tracking && state.expedition_state?.tracking?.visit_id !== state.expedition_state?.expedition?.chamber?.visit_id">
						<p><lang-string lang-id="MOD_MP_EXPEDITION_UI_WORK_FROM_A_DEPARTED_CHAMBER_IS_AWAITING_CHECK_IN_ONLY_VERIFIED_WORK_BEFORE"></lang-string></p>
						<button type="button" class="mp-expedition-button" :disabled="state.expedition_action_pending || state.expedition_pending_report || state.expedition_check_in_cooldown_until > 0" @click="state.submit_expedition_work('check-in')"><lang-string lang-id="MOD_MP_EXPEDITION_UI_CHECK_IN_PRIOR_WORK"></lang-string></button>
					</div>
					<div v-if="state.expedition_state?.expedition?.chamber">
						<div class="mp-expedition-panel mp-expedition-chamber-card">
							<div class="mp-expedition-chamber-art-frame" :class="{ 'mp-expedition-rift-snow': state.expedition_state?.expedition?.chamber?.id === 'entrance' }" aria-hidden="true">
								<img class="mp-expedition-chamber-art" :data-chamber-id="state.expedition_state?.expedition?.chamber?.id" :src="state.expedition_chamber_art_url(state.expedition_state?.expedition?.chamber?.id)" alt="" />
								<mp-expedition-snow v-if="state.expedition_state?.expedition?.chamber?.id === 'entrance'"></mp-expedition-snow>
								<mp-expedition-crystals v-if="state.expedition_state?.expedition?.chamber?.id === 'prismatic_descent'"></mp-expedition-crystals>
								<mp-expedition-haze v-if="state.expedition_state?.expedition?.chamber?.id === 'glassroot_terraces'"></mp-expedition-haze>
								<mp-expedition-observatory v-if="state.expedition_state?.expedition?.chamber?.id === 'buried_observatory'"></mp-expedition-observatory>
								<mp-expedition-orrery v-if="state.expedition_state?.expedition?.chamber?.id === 'prismatic_orrery'"></mp-expedition-orrery>
							</div>
							<div class="mp-expedition-chamber-copy">
								<h2 :class="{ 'mp-expedition-chamber-title': state.expedition_state?.expedition?.chamber?.id === 'entrance' }">{{ state.expedition_display_label(state.expedition_state?.expedition?.chamber?.label) }}</h2>
								<p>{{ state.expedition_text(state.expedition_state?.expedition?.chamber?.participant_count === 1 ? 'MOD_MP_EXPEDITION_PARTICIPANT_AT_ARRIVAL' : 'MOD_MP_EXPEDITION_PARTICIPANTS_AT_ARRIVAL', state.expedition_state?.expedition?.chamber?.participant_count) }}</p>
								<p class="mp-expedition-points"><lang-string lang-id="MOD_MP_EXPEDITION_UI_YOUR_EP"></lang-string> <strong>{{ state.expedition_points(state.expedition_state?.points_micros) }}</strong></p>
								<label class="mp-expedition-work-prompts-toggle"><input type="checkbox" :checked="state.expedition_work_prompts_enabled" @change="state.set_expedition_work_prompts($event)"><lang-string lang-id="MOD_MP_EXPEDITION_WORK_PROMPTS_TOGGLE"></lang-string></label>
								<button type="button" class="mp-expedition-button" v-if="!state.expedition_state?.expedition?.registered" :disabled="state.expedition_action_pending" @click="state.register_expedition()"><lang-string lang-id="MOD_MP_EXPEDITION_UI_REGISTER_TO_WORK"></lang-string></button>
							</div>
						</div>
						<div class="mp-expedition-panel mp-expedition-tracking" v-if="state.expedition_state?.tracking && state.expedition_state?.tracking?.visit_id === state.expedition_state?.expedition?.chamber?.visit_id">
							<div class="mp-expedition-tracking-copy">
								<i class="fa fa-crosshairs" aria-hidden="true"></i>
								<div><strong>{{ state.expedition_text('MOD_MP_EXPEDITION_TRACKING_TITLE', state.expedition_tracking_title(state.expedition_state?.expedition?.chamber, state.expedition_state?.tracking)) }}</strong><small>{{ state.expedition_text('MOD_MP_EXPEDITION_STARTED_AGO', state.expedition_time_since(state.expedition_state?.tracking?.started_at)) }}</small></div>
							</div>
							<div class="mp-expedition-actions"><div class="mp-expedition-available" v-if="state.expedition_state?.tracking?.reward_remaining_ms != null"><lang-string lang-id="MOD_MP_EXPEDITION_AVAILABLE_TO_EARN"></lang-string><strong>{{ state.expedition_points(Math.floor((state.expedition_state?.tracking?.reward_remaining_ms ?? 0) * 1000000 / 3600000)) }} EP</strong></div><button type="button" class="mp-expedition-button" :disabled="state.expedition_action_pending || state.expedition_pending_report || state.expedition_check_in_cooldown_until > 0" @click="state.submit_expedition_work('check-in')"><lang-string lang-id="MOD_MP_EXPEDITION_UI_CHECK_IN"></lang-string></button><button type="button" class="mp-expedition-button mp-expedition-button-secondary" :disabled="state.expedition_action_pending || state.expedition_pending_report" @click="state.submit_expedition_work('stop')"><lang-string lang-id="MOD_MP_EXPEDITION_UI_STOP_TRACKING"></lang-string></button></div>
						</div>
						<div class="mp-expedition-layout">
							<div class="mp-expedition-work-column">
								<section class="mp-expedition-panel mp-expedition-phase" v-for="phase in ['arrival', 'exploration', 'departure']" :key="phase" v-show="phase === 'arrival' || state.expedition_phase_tasks(state.expedition_state?.expedition?.chamber, phase).length">
									<h3 class="mp-expedition-phase-heading"><button type="button" class="mp-expedition-phase-toggle" :aria-expanded="state.expedition_phase_open[phase]" :aria-controls="'mp-expedition-' + phase + '-body'" @click="state.toggle_expedition_phase(phase)">
										<i class="fa" :class="state.expedition_phase_tasks(state.expedition_state?.expedition?.chamber, phase).every(task => task.completed_at != null) ? 'fa-check-circle mp-expedition-phase-done' : phase === 'exploration' ? 'fa-compass' : phase === 'departure' ? 'fa-door-open' : 'fa-map-marker'" aria-hidden="true"></i>
										<span><strong>{{ phase === 'arrival' ? getLangString('MOD_MP_EXPEDITION_PHASE_ARRIVAL') : phase === 'exploration' ? getLangString('MOD_MP_EXPEDITION_PHASE_EXPLORATION') : getLangString('MOD_MP_EXPEDITION_PHASE_DEPARTURE') }}</strong><small>{{ state.expedition_phase_summary(state.expedition_state?.expedition?.chamber, phase) }}</small></span>
										<i class="fa" :class="state.expedition_phase_open[phase] ? 'fa-chevron-up' : 'fa-chevron-down'" aria-hidden="true"></i>
									</button></h3>
									<div class="mp-expedition-phase-body" :id="'mp-expedition-' + phase + '-body'" v-show="state.expedition_phase_open[phase]">
										<div class="mp-expedition-task-group" v-for="group in ['done', 'active', 'pending']" :key="group" v-show="state.expedition_phase_tasks(state.expedition_state?.expedition?.chamber, phase, group).length">
											<h4>{{ group === 'done' ? getLangString('MOD_MP_EXPEDITION_GROUP_DONE') : group === 'active' ? getLangString('MOD_MP_EXPEDITION_GROUP_ACTIVE') : getLangString('MOD_MP_EXPEDITION_GROUP_PENDING') }}</h4>
											<article class="mp-expedition-task" :class="{ 'mp-expedition-task-done': group === 'done', 'mp-expedition-task-self': state.expedition_state?.tracking?.visit_id === state.expedition_state?.expedition?.chamber?.visit_id && state.expedition_state?.tracking?.task_id === task.task_id }" v-for="task in state.expedition_phase_tasks(state.expedition_state?.expedition?.chamber, phase, group)" :key="task.task_id">
													<div class="mp-expedition-task-heading"><i class="fa fa-check-circle" :aria-label="getLangString('MOD_MP_EXPEDITION_COMPLETE')" v-if="group === 'done'"></i><strong>{{ state.expedition_display_label(task.title, state.expedition_state?.expedition?.chamber?.exits?.length, state.expedition_state?.expedition?.chamber?.id) }}</strong><span class="mp-expedition-task-requirement" :class="{ 'mp-expedition-task-required': task.promoted_at || task.requirement === 'required' || (task.requirement === 'conditional' && task.exit_id === state.expedition_state?.expedition?.chamber?.vote?.chosen_exit_id) }" v-if="group !== 'done'">{{ task.promoted_at || task.requirement === 'required' || (task.requirement === 'conditional' && task.exit_id === state.expedition_state?.expedition?.chamber?.vote?.chosen_exit_id) ? getLangString('MOD_MP_EXPEDITION_REQUIRED') : getLangString('MOD_MP_EXPEDITION_OPTIONAL') }}</span></div>
													<span class="mp-expedition-task-tracking" v-if="group !== 'done' && state.expedition_state?.tracking?.visit_id === state.expedition_state?.expedition?.chamber?.visit_id && state.expedition_state?.tracking?.task_id === task.task_id"><lang-string lang-id="MOD_MP_EXPEDITION_UI_YOU_ARE_TRACKING_THIS"></lang-string></span>
												<div class="mp-expedition-work-list" :class="{ 'mp-expedition-work-icons-only': group === 'done' }" :aria-label="group === 'done' ? getLangString('MOD_MP_EXPEDITION_ACCEPTED_ACTIVITIES') : getLangString('MOD_MP_EXPEDITION_CONTRIBUTE_ACTIVITIES')">
													<span v-if="group !== 'done'"><lang-string lang-id="MOD_MP_EXPEDITION_UI_CONTRIBUTE_WITH_ANY_OF_THESE"></lang-string></span>
													<div class="mp-expedition-work" v-for="skill_id in task.evidence?.skill_ids || []" :key="skill_id" :title="state.expedition_work_name(skill_id)" :aria-label="state.expedition_work_name(skill_id)" role="img">
														<img :src="state.expedition_work_icon(skill_id)" alt="" draggable="false"><span v-if="group !== 'done'">{{ state.expedition_work_name(skill_id) }}</span>
													</div>
												</div>
												<div class="mp-expedition-progress-wrap" :class="{ 'mp-expedition-progress-done': group === 'done' }" tabindex="0" :aria-label="state.expedition_display_label(task.title, state.expedition_state?.expedition?.chamber?.exits?.length, state.expedition_state?.expedition?.chamber?.id) + ': ' + state.expedition_progress_description(task)">
													<div class="mp-expedition-progress" role="progressbar" :aria-valuenow="state.expedition_percent(task)" aria-valuemin="0" aria-valuemax="100" :aria-label="state.expedition_display_label(task.title, state.expedition_state?.expedition?.chamber?.exits?.length, state.expedition_state?.expedition?.chamber?.id)" :aria-valuetext="state.expedition_progress_description(task)">
															<span class="mp-expedition-progress-own" :style="{ width: state.expedition_progress_width(task.personal_ms, task) }"></span><span class="mp-expedition-progress-others" :style="{ width: state.expedition_progress_width(state.expedition_other_player_ms(task), task) }"></span><span class="mp-expedition-progress-assistance" :style="{ width: state.expedition_progress_width(task.system_ms, task) }"></span>
														</div>
													<div class="mp-expedition-progress-detail" role="tooltip" v-if="state.expedition_contribution_time(task.personal_ms) || state.expedition_contribution_time(state.expedition_other_player_ms(task)) || state.expedition_contribution_time(task.system_ms)">

								<img class="mp-chat-conversation-icon" :src="state.get_chat_participant_icon(conversation)"><div class="mp-chat-conversation-copy"><div class="font-w600">{{ conversation.participant.display_name }}</div><div class="font-size-sm text-muted mp-chat-preview" v-if="conversation.latest_message">{{ state.get_chat_plain_content(conversation.latest_message) }}</div><div class="font-size-sm text-muted" v-else><lang-string lang-id="MOD_MP_CHAT_NO_MESSAGES"></lang-string></div></div><span class="badge badge-danger" v-if="conversation.unread_count > 0">{{ conversation.unread_count }}</span>

						<button type="button" aria-haspopup="dialog" :aria-label="getLangString('MOD_MP_CHAT_TRANSLATION_TITLE')" class="btn btn-sm btn-primary mp-translation-button" :aria-pressed="state.is_chat_translation_enabled()" @click="state.show_chat_translation_modal()"><i class="fa fa-language"></i></button>
						<button type="button" class="btn btn-sm btn-secondary mp-notifications-button" v-if="state.selected_chat_conversation?.conversation_kind !== 'polls' && state.selected_chat_conversation?.conversation_kind !== 'poll-discussion'" :aria-label="getLangString(state.is_chat_notifications_enabled() ? 'MOD_MP_CHAT_NOTIFICATIONS_ENABLED' : 'MOD_MP_CHAT_NOTIFICATIONS_DISABLED')" :aria-pressed="state.is_chat_notifications_enabled()" :disabled="state.chat_notifications_busy" @click="state.toggle_chat_notifications()"><i class="fa" :class="state.is_chat_notifications_enabled() ? 'fa-bell' : 'fa-bell-slash'" aria-hidden="true"></i></button>
					</div>
					<button type="button" class="mp-chat-participant" v-if="(state.selected_chat_conversation?.conversation_kind || 'private') === 'private'" @click="state.show_chat_actions_modal()" aria-haspopup="dialog">
						<img class="skill-icon-xs" :src="state.get_chat_participant_icon()">
						<span class="font-w600">{{ state.selected_chat_conversation?.participant?.display_name }}</span>

					<div class="mp-chat-participant" v-else>

				<div class="font-w600 mp-poll-question mp-poll-discussion-question" v-if="state.selected_chat_conversation?.conversation_kind === 'poll-discussion' && state.selected_chat_conversation?.poll" v-text="state.get_chat_message_content(state.selected_chat_conversation?.poll)"></div>

						<div class="font-w600 mp-poll-question">{{ state.get_chat_message_content(poll) }}</div>
						<button type="button" class="mp-poll-option" :class="{ 'mp-poll-option-selected': option.selected }" :disabled="!poll.open" v-for="option in poll.options" :key="option.option_id" @click="state.toggle_poll_option(poll, option)"><span>{{ state.get_chat_message_content(option) }}</span><span class="badge badge-primary">{{ option.vote_count }}</span></button>
						<div class="mp-poll-actions"><button type="button" class="btn btn-sm btn-primary" @click="state.open_poll_discussion(poll)"><lang-string lang-id="MOD_MP_POLLS_GO_DISCUSSION"></lang-string><span class="badge badge-primary" v-if="poll.discussion_unread_count > 0">{{ poll.discussion_unread_count }}</span></button><button type="button" class="btn btn-sm btn-secondary" v-if="poll.can_edit && poll.open" @click="state.show_poll_creator(poll)"><lang-string lang-id="MOD_MP_POLLS_ADD_OPTIONS"></lang-string></button><button type="button" class="btn btn-sm btn-outline-danger" v-if="poll.can_delete" @click="state.show_poll_delete_confirmation(poll)"><lang-string lang-id="MOD_MP_POLLS_DELETE"></lang-string></button><div class="mp-poll-indicators"><button type="button" class="badge border-0" :class="poll.open ? 'badge-success' : 'badge-secondary'" v-if="poll.can_manage" @click="state.toggle_poll_open(poll)"><lang-string :lang-id="poll.open ? 'MOD_MP_POLLS_OPEN' : 'MOD_MP_POLLS_CLOSED'"></lang-string></button><span class="badge" :class="poll.open ? 'badge-success' : 'badge-secondary'" v-else><lang-string :lang-id="poll.open ? 'MOD_MP_POLLS_OPEN' : 'MOD_MP_POLLS_CLOSED'"></lang-string></span><span class="badge badge-info"><lang-string :lang-id="poll.choice_mode === 'single' ? 'MOD_MP_POLLS_SINGLE_CHOICE' : 'MOD_MP_POLLS_MULTI_CHOICE'"></lang-string></span></div></div>

				</div>
				<div class="mp-chat-messages" role="log" aria-live="polite" v-else>

					</div>
					<div class="text-center text-muted" v-if="state.chat_messages_loading && state.chat_messages.length === 0"><lang-string lang-id="MOD_MP_CHAT_LOADING"></lang-string></div>
					<div class="text-center text-muted" v-else-if="state.chat_messages.length === 0"><lang-string lang-id="MOD_MP_CHAT_NO_MESSAGES"></lang-string></div>
					<div class="mp-chat-message" :class="{ 'mp-chat-message-own': message.sent_by_viewer === true || (message.sent_by_viewer === undefined && message.sender_id === state.chat_client_id) }" v-for="message in state.chat_messages" :key="message.message_id">
						<div class="mp-chat-message-meta"><button type="button" class="mp-chat-message-author" @click="state.show_chat_message_member(message)" :disabled="!message.sender_id"><img class="mp-chat-message-avatar" :src="state.get_chat_message_icon(message)" alt=""><span class="font-w600">{{ message.sender.display_name }}</span></button><button type="button" class="mp-chat-message-timestamp" @click="state.show_chat_message_actions(message)"><time :datetime="state.format_chat_datetime(message.created_at)">{{ state.format_chat_time(message.created_at) }}</time></button></div>
						<div class="mp-chat-message-bubble">
							<div class="mp-chat-message-content" :class="{ 'mp-chat-message-translating': state.get_chat_message_content(message) === getLangString('MOD_MP_CHAT_TRANSLATING') }"><mp-chat-message-body :parts="state.get_chat_message_document(message)"></mp-chat-message-body></div>
							<div class="mp-chat-reactions" :class="{ 'mp-chat-reactions-empty': !message.reactions?.length }">
								<button type="button" class="mp-chat-reaction-summary" :class="{ 'mp-chat-reaction-reacted': summary.reacted }" :disabled="state.selected_chat_conversation?.conversation_kind === 'testers' && state.selected_chat_conversation?.can_send !== true" v-for="summary in message.reactions" :key="summary.reaction" @click="state.toggle_chat_reaction(message, summary.reaction)"><span>{{ summary.reaction }}</span><span>{{ summary.count }}</span></button>
								<button type="button" class="mp-chat-reaction-add" v-if="message.message_id > 0 && (state.selected_chat_conversation?.conversation_kind !== 'testers' || state.selected_chat_conversation?.can_send)" :aria-label="state.get_chat_reaction_add_label()" :aria-expanded="state.chat_reaction_picker_message_id === message.message_id" @click="state.toggle_chat_reaction_picker(message, $event)">☻<span aria-hidden="true">+</span></button>
							</div>
						</div>
					</div>
				</div>
				<div class="block-content mp-chat-compose" v-if="state.selected_chat_conversation?.conversation_kind === 'polls'">
					<button type="button" class="btn btn-primary btn-block" v-if="state.poll_can_create" @click="state.show_poll_creator()"><lang-string lang-id="MOD_MP_POLLS_CREATE"></lang-string></button>
				</div>
				<div class="block-content mp-chat-compose" v-else-if="state.selected_chat_conversation?.conversation_kind === 'testers' && state.selected_chat_conversation?.can_send !== true">
					<div class="mp-chat-disabled-message"><lang-string lang-id="MOD_MP_TESTER_CHAT_READ_ONLY"></lang-string></div>
				</div>
				<div class="block-content mp-chat-compose" v-else-if="state.selected_chat_conversation?.synthetic_unsupported !== true">
					<div class="mp-chat-support-prompts" v-if="state.show_chat_support_prompts">
						<div class="mp-chat-support-prompts-label"><lang-string lang-id="MOD_MP_CHAT_SUPPORT_PROMPTS"></lang-string></div>
						<div class="mp-chat-support-prompt-actions">
							<button type="button" class="btn btn-primary" @click="state.select_chat_support_prompt('MOD_MP_CHAT_SUPPORT_PROBLEM')"><lang-string lang-id="MOD_MP_CHAT_SUPPORT_PROBLEM"></lang-string></button>
							<button type="button" class="btn btn-primary" @click="state.select_chat_support_prompt('MOD_MP_CHAT_SUPPORT_SUGGESTION')"><lang-string lang-id="MOD_MP_CHAT_SUPPORT_SUGGESTION"></lang-string></button>
						</div>
					</div>
					<form v-else @submit="state.send_chat_message($event)">
						<mp-chat-composer :value="state.get_chat_draft_document()" :disabled="(state.selected_chat_conversation?.conversation_kind || 'private') === 'private' && !state.messaging_enabled ? 'disabled' : null" :placeholder="state.get_chat_compose_placeholder()"></mp-chat-composer>
						<div class="mp-chat-compose-actions">
							<button type="button" class="btn btn-secondary mp-chat-insert-item" @mousedown.prevent @click="state.open_chat_item_picker()" :disabled="(state.selected_chat_conversation?.conversation_kind || 'private') === 'private' && !state.messaging_enabled"><lang-string lang-id="MOD_MP_CHAT_INSERT_ITEM"></lang-string></button>
							<button type="button" class="btn btn-secondary mp-chat-insert-feature" @mousedown.prevent @click="state.open_chat_feature_picker()" :disabled="(state.selected_chat_conversation?.conversation_kind || 'private') === 'private' && !state.messaging_enabled"><lang-string lang-id="MOD_MP_CHAT_TAG_FEATURE">$Feature</lang-string></button>
							<span class="mp-chat-compose-count" :class="{ 'text-danger': !state.is_chat_item_draft_valid() }">{{ state.get_chat_item_count_label() }}</span>
							<button type="button" class="mp-chat-budget" v-if="(state.selected_chat_conversation?.conversation_kind || 'private') === 'private' && state.chat_budget_enabled" @click="state.show_chat_budget_modal()" aria-haspopup="dialog" :aria-label="getLangString('MOD_MP_CHAT_BUDGET_ARIA')">
								<mp-lang-string-f lang-id="MOD_MP_CHAT_BUDGET" :lang-arg-1="state.chat_budget.credits" :lang-arg-2="state.chat_budget.maximum"></mp-lang-string-f>
								<img class="skill-icon-xxs" :src="state.get_item_icon('melvorD:Message_In_A_Bottle')" alt="">
								<span class="spinner-border spinner-border-sm text-primary" role="status" v-if="state.chat_budget.credits < state.chat_budget.maximum"></span>
							</button>
							<button type="submit" class="btn btn-primary" :disabled="!state.chat_can_send"><span class="spinner-border spinner-border-sm text-light mr-2" role="status" v-if="state.chat_sending"></span><lang-string lang-id="MOD_MP_CHAT_SEND"></lang-string></button>
						</div>
					</form>
					<div class="text-danger mt-2" role="status" v-if="!state.is_chat_item_draft_valid()"><lang-string lang-id="MOD_MP_CHAT_ITEM_LIMIT"></lang-string></div>
					<div class="text-danger mt-2" v-if="state.chat_error">{{ state.chat_error }}</div>
				</div>
			</div>
			<div class="mp-chat-reaction-picker" v-if="state.chat_reaction_picker_message_id !== null" :style="state.chat_reaction_picker_style">
				<button type="button" v-for="reaction in state.chat_reaction_choices" :key="reaction" @click="state.toggle_chat_reaction(state.get_chat_reaction_picker_message(), reaction)">{{ reaction }}</button>
				<button type="button" v-for="reaction in state.chat_reaction_random_choices" :key="reaction" @click="state.toggle_chat_reaction(state.get_chat_reaction_picker_message(), reaction)">{{ reaction }}</button>
			</div>
		</div>
	</div>
</template>

<template id="template-mp-chat-item-picker-modal">
	<div class="mp-chat-item-picker">
		<input type="search" class="mp-input-text mp-chat-item-search" :placeholder="getLangString('MOD_MP_PLACEHOLDER_SEARCH_ITEMS')" :aria-label="getLangString('MOD_MP_PLACEHOLDER_SEARCH_ITEMS')" @input="state.update_chat_item_search($event)" @keydown="state.handle_chat_item_search_key($event)">
		<div class="mp-chat-item-results" @touchmove="state.stop_icon_scroll_propagation($event)"></div>
		<div class="text-muted p-3 mp-chat-item-empty d-none" role="status"><lang-string lang-id="MOD_MP_CHAT_NO_ITEM_MATCHES"></lang-string></div>
		<div class="text-muted font-size-sm mt-2"><lang-string lang-id="MOD_MP_CHAT_ITEM_SEARCH_HINT"></lang-string></div>
		<div class="text-muted font-size-sm"><lang-string lang-id="MOD_MP_CHAT_ITEM_DISCOVERY_HINT"></lang-string></div>
		<div class="mp-button-tray mt-3"><button type="button" class="btn btn-secondary" @click="state.close_modal()"><lang-string lang-id="MOD_MP_BUTTON_CANCEL"></lang-string></button></div>
	</div>
</template>

<template id="template-mp-expedition-work-prompt-modal">
	<p class="mp-modal-text">{{ state.expedition_text('MOD_MP_EXPEDITION_WORK_PROMPT_INFO', state.expedition_prompt_activity_names()) }}</p>
	<div class="mp-expedition-prompt-tasks" @touchmove="state.stop_icon_scroll_propagation($event)">
		<article class="mp-expedition-task" v-for="task in state.expedition_prompt_tasks()" :key="task.task_id">
			<div class="mp-expedition-task-heading"><strong>{{ state.expedition_display_label(task.title, state.expedition_state?.expedition?.chamber?.exits?.length, state.expedition_state?.expedition?.chamber?.id) }}</strong><span class="mp-expedition-task-requirement" :class="{ 'mp-expedition-task-required': task.promoted_at || task.requirement === 'required' || (task.requirement === 'conditional' && task.exit_id === state.expedition_state?.expedition?.chamber?.vote?.chosen_exit_id) }">{{ task.promoted_at || task.requirement === 'required' || (task.requirement === 'conditional' && task.exit_id === state.expedition_state?.expedition?.chamber?.vote?.chosen_exit_id) ? getLangString('MOD_MP_EXPEDITION_REQUIRED') : getLangString('MOD_MP_EXPEDITION_OPTIONAL') }}</span></div>
			<div class="mp-expedition-work-list" :aria-label="getLangString('MOD_MP_EXPEDITION_CONTRIBUTE_ACTIVITIES')">
				<span><lang-string lang-id="MOD_MP_EXPEDITION_UI_CONTRIBUTE_WITH_ANY_OF_THESE"></lang-string></span>
				<div class="mp-expedition-work" v-for="skill_id in task.evidence?.skill_ids || []" :key="skill_id" :title="state.expedition_work_name(skill_id)" :aria-label="state.expedition_work_name(skill_id)" role="img">
					<img :src="state.expedition_work_icon(skill_id)" alt="" draggable="false"><span>{{ state.expedition_work_name(skill_id) }}</span>
				</div>
			</div>
			<div class="mp-expedition-progress-wrap" tabindex="0" :aria-label="state.expedition_display_label(task.title, state.expedition_state?.expedition?.chamber?.exits?.length, state.expedition_state?.expedition?.chamber?.id) + ': ' + state.expedition_progress_description(task)">
				<div class="mp-expedition-progress" role="progressbar" :aria-valuenow="state.expedition_percent(task)" aria-valuemin="0" aria-valuemax="100" :aria-label="state.expedition_display_label(task.title, state.expedition_state?.expedition?.chamber?.exits?.length, state.expedition_state?.expedition?.chamber?.id)" :aria-valuetext="state.expedition_progress_description(task)">
						<span class="mp-expedition-progress-own" :style="{ width: state.expedition_progress_width(task.personal_ms, task) }"></span><span class="mp-expedition-progress-others" :style="{ width: state.expedition_progress_width(state.expedition_other_player_ms(task), task) }"></span><span class="mp-expedition-progress-assistance" :style="{ width: state.expedition_progress_width(task.system_ms, task) }"></span>
					</div>
				<div class="mp-expedition-progress-detail" role="tooltip" v-if="state.expedition_contribution_time(task.personal_ms) || state.expedition_contribution_time(state.expedition_other_player_ms(task)) || state.expedition_contribution_time(task.system_ms)">
						<span v-if="state.expedition_contribution_time(task.personal_ms)"><i class="mp-expedition-progress-key mp-expedition-progress-own"></i>{{ state.expedition_text('MOD_MP_EXPEDITION_YOUR_WORK_TIME', state.expedition_contribution_time(task.personal_ms)) }}</span><span v-if="state.expedition_contribution_time(state.expedition_other_player_ms(task))"><i class="mp-expedition-progress-key mp-expedition-progress-others"></i>{{ state.expedition_text('MOD_MP_EXPEDITION_OTHER_WORK_TIME', state.expedition_contribution_time(state.expedition_other_player_ms(task))) }}</span><span v-if="state.expedition_contribution_time(task.system_ms)"><i class="mp-expedition-progress-key mp-expedition-progress-assistance"></i>{{ state.expedition_text('MOD_MP_EXPEDITION_ASSISTANCE_TIME', state.expedition_contribution_time(task.system_ms)) }}</span>
				</div>
			</div>
			<div>
				<p class="mp-expedition-progress-percent"><strong>{{ state.expedition_remaining(task) }}</strong> · {{ state.expedition_text('MOD_MP_EXPEDITION_PERCENT_COMPLETE', state.expedition_percent(task)) }}</p>
				<p v-if="task.trackers?.length">{{ state.expedition_text('MOD_MP_EXPEDITION_TRACKERS', task.trackers.map(member => member.display_name).join(', ')) }}</p>
				<div class="mp-expedition-task-actions" v-if="state.expedition_state?.expedition?.registered && (state.expedition_state?.tracking?.visit_id !== state.expedition_state?.expedition?.chamber?.visit_id || state.expedition_state?.tracking?.task_id !== task.task_id)">
					<button type="button" class="mp-expedition-button" :disabled="state.expedition_action_pending || state.expedition_pending_report || !state.expedition_can_track(task) || (state.expedition_state?.tracking && state.expedition_state?.tracking?.visit_id !== state.expedition_state?.expedition?.chamber?.visit_id)" @click="state.start_prompted_expedition_task(task.task_id)"><lang-string lang-id="MOD_MP_EXPEDITION_UI_TRACK_THIS_TASK"></lang-string></button>
					<div class="mp-expedition-available"><lang-string lang-id="MOD_MP_EXPEDITION_AVAILABLE_TO_EARN"></lang-string><strong>{{ state.expedition_available_points(task) }} EP</strong></div>
				</div>
			</div>
		</article>
	</div>
</template>
