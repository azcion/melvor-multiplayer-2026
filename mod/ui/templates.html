<template id="template-mp-account-options">
	<div id="mp-account-options">
		<template v-if="state.is_connected">
			<h5 class="dropdown-header text-warning">
				<lang-string lang-id="MOD_MP_MENU_HEADER"></lang-string>
			</h5>
			<a class="dropdown-item pointer-enabled" @click.stop="state.show_options_modal()">
				<img class="skill-icon-xxs" :src="state.get_avatar_icon(state.profile_icon)"/>
				<lang-string lang-id="MOD_MP_MENU_OPTIONS"></lang-string>
			</a>
		</template>
	</div>
</template>
<template id="template-mp-raid-page">
	<div class="content d-none" id="mp-raid-page">
		<div class="block block-rounded">
			<div class="block-header block-header-default">
				<div><h3 class="block-title"><lang-string lang-id="MOD_MP_RAID_TITLE"></lang-string></h3></div>
				<button type="button" class="btn btn-sm btn-secondary" @click="state.open_guild_page()"><lang-string lang-id="MOD_MP_RAID_BACK_GUILD"></lang-string></button>
			</div>
			<div class="block-content text-center" v-if="state.raid_loading && !state.raid"><span class="spinner-border spinner-border-sm text-primary mr-2"></span><lang-string lang-id="MOD_MP_RAID_LOADING"></lang-string></div>
			<div class="block-content text-muted" v-else-if="state.raid_state.affiliation === 'none'"><lang-string lang-id="MOD_MP_RAID_GUILD_REQUIRED"></lang-string></div>
			<div class="block-content mp-raid-activation" v-else-if="!state.raid">
				<img class="mp-raid-hero" :src="state.get_raid_monster_icon(4)">
				<div><h4><lang-string lang-id="MOD_MP_RAID_READY_TITLE"></lang-string></h4><p class="text-muted"><lang-string lang-id="MOD_MP_RAID_READY_INFO"></lang-string></p><button type="button" class="btn btn-primary" :disabled="!state.raid_state.can_activate || state.raid_action_pending" @click="state.activate_raid()"><span class="spinner-border spinner-border-sm mr-2" v-if="state.raid_action_pending"></span><lang-string lang-id="MOD_MP_RAID_ACTIVATE"></lang-string></button></div>
			</div>
			<template v-else>
				<div class="block-content mp-raid-overview">
					<div class="mp-raid-health-copy"><span class="font-w600"><lang-string lang-id="MOD_MP_RAID_SHARED_HEALTH"></lang-string></span><span>{{ state.raid.remaining_health }} / {{ state.raid.max_health }}</span></div>
					<div class="progress mp-raid-health"><div class="progress-bar bg-success" :style="{ width: state.raid_progress_pct + '%' }"></div></div>
					<div class="mp-raid-stats">
						<div><span><lang-string lang-id="MOD_MP_RAID_STATUS"></lang-string></span><strong>{{ state.raid.secured ? 'Secured' : state.raid.active ? 'Active' : 'Failed' }}</strong></div>
						<div><span><lang-string lang-id="MOD_MP_RAID_TIME"></lang-string></span><strong>{{ state.raid.active ? state.format_raid_time(state.raid.expires_at) : 'Ended' }}</strong></div>
						<div><span><lang-string lang-id="MOD_MP_RAID_ASSAULTS"></lang-string></span><strong>{{ state.raid.member?.assaults ?? 0 }}</strong></div>
						<div><span><lang-string lang-id="MOD_MP_RAID_CONTRIBUTION"></lang-string></span><strong>{{ state.raid.member?.contribution ?? 0 }} / {{ state.raid.contribution_cap }}</strong></div>
					</div>
					<div class="alert alert-warning mt-3" v-if="!state.raid.member"><lang-string lang-id="MOD_MP_RAID_NOT_ROSTERED"></lang-string></div>
					<div class="alert alert-success mt-3" v-if="state.raid.secured"><lang-string lang-id="MOD_MP_RAID_SECURED_INFO"></lang-string></div>
					<div class="mt-3" v-if="!state.raid.active && state.raid_state.can_activate"><button type="button" class="btn btn-primary" :disabled="state.raid_action_pending" @click="state.activate_raid()"><span class="spinner-border spinner-border-sm mr-2" v-if="state.raid_action_pending"></span><lang-string lang-id="MOD_MP_RAID_ACTIVATE_NEXT"></lang-string></button></div>
				</div>
			</template>
			<div class="block-content text-danger" v-if="state.raid_error">{{ state.raid_error }}</div>
		</div>

		<div class="block block-rounded" v-if="state.raid?.active && state.raid?.member">
			<div class="block-header block-header-default"><h3 class="block-title"><lang-string lang-id="MOD_MP_RAID_CHOOSE_TIER"></lang-string></h3></div>
			<div class="block-content mp-raid-tiers">
				<div class="mp-raid-tier" v-for="tier in [1, 2, 3, 4]" :key="tier">
					<img :src="state.get_raid_monster_icon(tier)">
					<h4>Tier {{ tier }}</h4>
					<div class="font-size-sm text-muted"><mp-lang-string-f lang-id="MOD_MP_RAID_TIER_PROGRESS" :lang-arg-1="state.get_raid_tier_progress(tier)"></mp-lang-string-f></div>
					<button type="button" class="btn btn-primary" :disabled="!state.raid_can_assault" @click="state.begin_raid_assault(tier)"><lang-string lang-id="MOD_MP_RAID_BEGIN_ASSAULT"></lang-string></button>
				</div>
			</div>
			<div class="block-content font-size-sm text-muted"><lang-string lang-id="MOD_MP_RAID_ASSAULT_WARNING"></lang-string></div>
		</div>

		<div class="block block-rounded" v-if="state.raid">
			<div class="block-header block-header-default"><h3 class="block-title"><lang-string lang-id="MOD_MP_RAID_PARTICIPANTS"></lang-string></h3></div>
			<div class="block-content p-0 mp-raid-leaderboard">
				<div class="mp-raid-leaderboard-row" v-for="member in state.raid.leaderboard" :key="member.client_id"><img class="skill-icon-xs" :src="state.get_avatar_icon(member.icon_id)"><span class="font-w600">{{ member.display_name }}</span><span>Tier {{ member.highest_tier || '—' }}</span><span>{{ member.contribution }}</span></div>
			</div>
		</div>
	</div>
</template>
<template id="template-mp-raid-cache-modal">
	<div class="mp-modal-text"><lang-string lang-id="MOD_MP_RAID_CACHE_INFO"></lang-string></div>
	<button type="button" class="btn btn-primary" @click="state.open_transfer_data_page()"><lang-string lang-id="MOD_MP_RAID_CACHE_OPEN"></lang-string></button>
</template>
<template id="template-mp-member-actions-modal">
	<div class="mp-member-actions" v-if="state.selected_guild_member">
		<template v-if="state.selected_guild_member.client_id === state.guild_client_id || state.guild_client_id === null">
			<button type="button" class="btn btn-primary" @click="state.open_display_name_from_options()">
				<lang-string lang-id="MOD_MP_MENU_CHANGE_DISPLAY_NAME"></lang-string>
			</button>
			<button type="button" class="btn btn-primary" @click="state.open_icon_from_options()">
				<lang-string lang-id="MOD_MP_MENU_CHANGE_ICON"></lang-string>
			</button>
			<button type="button" class="btn btn-primary" v-if="state.identities.length > 0" @click="state.open_identities_from_options()">
				<lang-string lang-id="MOD_MP_IDENTITIES_TITLE"></lang-string>
			</button>
			<label class="mp-equipment-visibility">
				<input type="checkbox" :checked="state.equipment_visible" :disabled="state.equipment_visibility_pending" @click="state.set_equipment_visibility($event)">
				<span><lang-string lang-id="MOD_MP_EQUIPMENT_VISIBILITY"></lang-string></span>
				<span class="spinner-border spinner-border-sm text-primary" role="status" v-if="state.equipment_visibility_pending"></span>
			</label>
			<label class="mp-status-visibility">
				<input type="checkbox" :checked="state.status_visible" :disabled="state.status_visibility_pending" @click="state.set_status_visibility($event)">
				<span><lang-string lang-id="MOD_MP_STATUS_VISIBILITY"></lang-string></span>
				<span class="spinner-border spinner-border-sm text-primary" role="status" v-if="state.status_visibility_pending"></span>
			</label>
			<label class="mp-gp-visibility">
				<input type="checkbox" :checked="state.gp_visible" :disabled="state.gp_visibility_pending" @click="state.set_gp_visibility($event)">
				<span><lang-string lang-id="MOD_MP_GP_VISIBILITY"></lang-string></span>
				<span class="spinner-border spinner-border-sm text-primary" role="status" v-if="state.gp_visibility_pending"></span>
			</label>
			<label class="mp-chat-visibility">
				<input type="checkbox" :checked="state.messaging_enabled" :disabled="state.chat_privacy_pending" @click="state.set_messaging_enabled($event)">
				<span><lang-string lang-id="MOD_MP_CHAT_PRIVACY_ENABLE"></lang-string></span>
				<span class="spinner-border spinner-border-sm text-primary" role="status" v-if="state.chat_privacy_pending"></span>
			</label>
			<div v-show="state.is_guild_member">
				<hr class="mp-member-actions-rule">
				<div class="font-size-sm font-w600 text-danger text-uppercase"><lang-string lang-id="MOD_MP_GUILD_DANGER_ZONE"></lang-string></div>
				<button type="button" class="btn btn-danger" @click="state.leave_guild_from_options()"><lang-string lang-id="MOD_MP_BUTTON_LEAVE_GUILD"></lang-string></button>
			</div>
		</template>
		<template v-else>
			<button type="button" class="btn btn-primary" @click="state.start_member_chat($event)">
				<span class="spinner-border spinner-border-sm text-light mr-2 d-none" role="status"></span>
				<lang-string lang-id="MOD_MP_CHAT_START"></lang-string>
			</button>
			<button type="button" class="btn btn-primary" :disabled="!state.member_profile_available" @click="state.view_member_profile($event)">
				<span class="spinner-border spinner-border-sm text-light mr-2 d-none" role="status"></span>
				<lang-string lang-id="MOD_MP_PROFILE_VIEW"></lang-string>
			</button>
			<div class="font-size-sm text-muted" v-if="!state.selected_guild_member.equipment_visible"><lang-string lang-id="MOD_MP_EQUIPMENT_NOT_SHARED"></lang-string></div>
			<div class="font-size-sm text-muted" v-else-if="!state.selected_guild_member.equipment_available"><lang-string lang-id="MOD_MP_EQUIPMENT_NOT_AVAILABLE_HINT"></lang-string></div>
			<div class="font-size-sm text-muted" v-if="!state.selected_guild_member.status_visible"><lang-string lang-id="MOD_MP_STATUS_NOT_SHARED"></lang-string></div>
			<div class="font-size-sm text-muted" v-else-if="!state.selected_guild_member.status_available"><lang-string lang-id="MOD_MP_STATUS_NOT_AVAILABLE_HINT"></lang-string></div>
		</template>
		<div class="text-danger" v-if="state.member_actions_error">{{ state.member_actions_error }}</div>
	</div>
</template>
<template id="template-mp-identities-modal">
	<div class="mp-modal-text"><lang-string lang-id="MOD_MP_IDENTITIES_INFO"></lang-string></div>
	<div class="mp-identity-list">
		<button type="button" class="btn btn-outline-primary mp-identity-row" v-for="identity in state.identities" @click="state.show_identity_actions(identity)">
			<img class="skill-icon-xs" :src="state.get_avatar_icon(identity.icon_id)">
			<span>{{ identity.display_name }}</span>
			<span class="badge badge-warning ml-auto" v-if="identity.deletion"><lang-string lang-id="MOD_MP_IDENTITY_DELETION_PENDING"></lang-string></span>
		</button>
	</div>
	<div class="text-danger mt-2" v-if="state.identities_error">{{ state.identities_error }}</div>
	<div class="mp-button-tray">
		<button type="button" class="btn btn-danger" @click="state.close_modal()"><lang-string lang-id="MOD_MP_BUTTON_CLOSE"></lang-string></button>
	</div>
</template>
<template id="template-mp-identity-actions-modal">
	<div v-if="state.selected_identity">
		<div class="mp-modal-text" v-if="state.selected_identity?.deletion">
			<lang-string lang-id="MOD_MP_IDENTITY_DELETION_SCHEDULED"></lang-string>
			<span>{{ state.format_identity_time(state.selected_identity?.deletion?.execute_at) }}</span>
		</div>
		<div class="mp-identity-actions">
			<button type="button" class="btn btn-danger" v-if="!state.selected_identity?.deletion" @click="state.show_identity_deletion_confirmation()">
				<lang-string lang-id="MOD_MP_IDENTITY_DELETE_ACTION"></lang-string>
			</button>
			<button type="button" class="btn btn-warning" v-else-if="state.selected_identity?.deletion?.can_cancel" @click="state.cancel_identity_deletion($event)">
				<span class="spinner-border spinner-border-sm text-light mr-2 d-none" role="status"></span>
				<lang-string lang-id="MOD_MP_IDENTITY_CANCEL_DELETION"></lang-string>
			</button>
			<div class="font-size-sm text-muted" v-else><lang-string lang-id="MOD_MP_IDENTITY_DELETION_OTHER_REQUESTER"></lang-string></div>
			<button type="button" class="btn btn-secondary" @click="state.back_to_identities()"><lang-string lang-id="MOD_MP_BUTTON_BACK"></lang-string></button>
		</div>
		<div id="mp-modal-error" class="d-none text-danger mt-2"></div>
	</div>
</template>
<template id="template-mp-identity-delete-confirm-modal">
	<div class="mp-modal-text" v-if="state.selected_identity">
		<mp-lang-string-f lang-id="MOD_MP_IDENTITY_DELETE_CONFIRM_INFO" :lang-arg-1="state.selected_identity?.display_name"></mp-lang-string-f>
		<lang-string lang-id="MOD_MP_IDENTITY_DELETE_CONFIRM_EFFECTS"></lang-string>
		<lang-string lang-id="MOD_MP_IDENTITY_DELETE_CONFIRM_CANCEL"></lang-string>
		<div id="mp-modal-error" class="d-none text-danger"></div>
	</div>
	<div class="mp-button-tray">
		<button type="button" class="btn btn-danger" @click="state.schedule_identity_deletion($event)">
			<span class="spinner-border spinner-border-sm text-light mr-2 d-none" role="status"></span>
			<lang-string lang-id="MOD_MP_IDENTITY_DELETE_ACTION"></lang-string>
		</button>
		<button type="button" class="btn btn-secondary" @click="state.close_modal()"><lang-string lang-id="MOD_MP_BUTTON_CANCEL"></lang-string></button>
	</div>
</template>
<template id="template-mp-identity-account-changed-modal">
	<div class="mp-modal-text"><lang-string lang-id="MOD_MP_IDENTITY_ACCOUNT_CHANGED_INFO"></lang-string></div>
</template>
<template id="template-mp-identity-deletion-cancelled-modal">
	<div class="mp-modal-text">
		<mp-lang-string-f lang-id="MOD_MP_IDENTITY_DELETION_CANCELLED_INFO" :lang-arg-1="state.identity_notice_requester" :lang-arg-2="state.identity_notice_time"></mp-lang-string-f>
	</div>
</template>
<template id="template-mp-identity-recovered-modal">
	<div class="mp-modal-text"><lang-string lang-id="MOD_MP_IDENTITY_RECOVERED_INFO"></lang-string></div>
</template>
<template id="template-mp-chat-page">
	<div class="content d-none" id="mp-chat-page">
		<div class="mp-chat-layout">
			<div class="block block-rounded" v-if="!state.selected_chat_conversation">
				<div class="block-header block-header-default">
					<div>
						<h3 class="block-title"><lang-string lang-id="MOD_MP_CHAT_INBOX"></lang-string></h3>
						<div class="font-size-sm text-muted"><lang-string lang-id="MOD_MP_CHAT_INBOX_INFO"></lang-string></div>
					</div>
					<span class="badge badge-info" v-if="state.chat_unread > 0">{{ state.chat_unread }}</span>
				</div>
				<div class="block-content text-center" v-if="state.chat_loading && state.chat_conversations.length === 0">
					<span class="spinner-border spinner-border-sm text-primary mr-2" role="status"></span>
					<lang-string lang-id="MOD_MP_CHAT_LOADING"></lang-string>
				</div>
				<div class="mp-chat-conversations" v-else-if="state.chat_conversations.length > 0">
					<button type="button" class="mp-chat-conversation" v-for="conversation in state.chat_conversations" :key="conversation.conversation_id" @click="state.open_chat_conversation(conversation)">
						<img class="skill-icon-sm" :src="state.get_avatar_icon(conversation.participant.icon_id)">
						<div class="mp-chat-conversation-copy">
							<div class="font-w600">{{ conversation.participant.display_name }}</div>
							<div class="font-size-sm text-muted mp-chat-preview" v-if="conversation.latest_message">{{ conversation.latest_message.content }}</div>
							<div class="font-size-sm text-muted" v-else><lang-string lang-id="MOD_MP_CHAT_NO_MESSAGES"></lang-string></div>
						</div>
						<span class="badge badge-danger" v-if="conversation.unread_count > 0">{{ conversation.unread_count }}</span>
					</button>
				</div>
				<div class="block-content text-muted" v-else><lang-string lang-id="MOD_MP_CHAT_EMPTY"></lang-string></div>
			</div>

			<div class="block block-rounded mp-chat-conversation-view" v-else>
				<div class="block-header block-header-default mp-chat-header">
					<button type="button" class="btn btn-sm btn-secondary" @click="state.close_chat_conversation()"><i class="fa fa-chevron-left mr-1"></i><lang-string lang-id="MOD_MP_CHAT_BACK"></lang-string></button>
					<button type="button" class="mp-chat-participant" @click="state.show_chat_actions_modal()" aria-haspopup="dialog">
						<img class="skill-icon-xs" :src="state.get_avatar_icon(state.selected_chat_conversation?.participant?.icon_id)">
						<span class="font-w600">{{ state.selected_chat_conversation?.participant?.display_name }}</span>
					</button>
				</div>
				<div class="block-content text-center" v-if="state.chat_has_more">
					<button type="button" class="btn btn-sm btn-secondary" :disabled="state.chat_messages_loading" @click="state.load_older_chat_messages()"><lang-string lang-id="MOD_MP_CHAT_LOAD_OLDER"></lang-string></button>
				</div>
				<div class="mp-chat-messages" role="log" aria-live="polite">
					<div class="text-center text-muted" v-if="state.chat_messages_loading && state.chat_messages.length === 0"><lang-string lang-id="MOD_MP_CHAT_LOADING"></lang-string></div>
					<div class="text-center text-muted" v-else-if="state.chat_messages.length === 0"><lang-string lang-id="MOD_MP_CHAT_NO_MESSAGES"></lang-string></div>
					<div class="mp-chat-message" :class="{ 'mp-chat-message-own': message.sender_id === state.chat_client_id }" v-for="message in state.chat_messages" :key="message.message_id">
						<div class="mp-chat-message-meta"><span class="font-w600">{{ message.sender.display_name }}</span><button type="button" class="mp-chat-message-timestamp" @click="state.show_chat_message_actions(message)"><time :datetime="state.format_chat_datetime(message.created_at)">{{ state.format_chat_time(message.created_at) }}</time></button></div>
						<div class="mp-chat-message-content">{{ message.content }}</div>
					</div>
				</div>
				<div class="block-content mp-chat-compose">
					<form @submit="state.send_chat_message($event)">
						<textarea class="mp-input-text" maxlength="1000" rows="3" v-model="state.chat_draft" @keydown="state.handle_chat_keydown($event)" :disabled="!state.messaging_enabled" :placeholder="state.get_chat_compose_placeholder()"></textarea>
						<div class="mp-chat-compose-actions">
							<button type="button" class="mp-chat-budget" @click="state.show_chat_budget_modal()" aria-haspopup="dialog" aria-label="Learn how Message capacity works">
								<mp-lang-string-f lang-id="MOD_MP_CHAT_BUDGET" :lang-arg-1="state.chat_budget.credits" :lang-arg-2="state.chat_budget.maximum"></mp-lang-string-f>
								<img class="skill-icon-xxs" :src="state.get_item_icon('melvorD:Message_In_A_Bottle')" alt="">
								<span class="spinner-border spinner-border-sm text-primary" role="status" v-if="state.chat_budget.credits < state.chat_budget.maximum"></span>
							</button>
							<button type="submit" class="btn btn-primary" :disabled="!state.chat_can_send"><span class="spinner-border spinner-border-sm text-light mr-2" role="status" v-if="state.chat_sending"></span><lang-string lang-id="MOD_MP_CHAT_SEND"></lang-string></button>
						</div>
					</form>
					<div class="text-danger mt-2" v-if="state.chat_error">{{ state.chat_error }}</div>
				</div>
			</div>
		</div>
	</div>
</template>
<template id="template-mp-chat-budget-info-modal">
	<div class="mp-modal-text mp-chat-budget-info">
		<div><lang-string lang-id="MOD_MP_CHAT_BUDGET_INFO"></lang-string></div>
		<div class="mp-chat-budget-info-heading"><lang-string lang-id="MOD_MP_CHAT_BUDGET_LEVELS"></lang-string></div>
		<div class="mp-chat-budget-info-effect"><span class="font-w600"><lang-string lang-id="MOD_MP_CHAT_BUDGET_LEVEL_99_LABEL"></lang-string></span><span><lang-string lang-id="MOD_MP_CHAT_BUDGET_LEVEL_99"></lang-string></span></div>
		<div class="mp-chat-budget-info-effect"><span class="font-w600"><lang-string lang-id="MOD_MP_CHAT_BUDGET_LEVEL_120_LABEL"></lang-string></span><span><lang-string lang-id="MOD_MP_CHAT_BUDGET_LEVEL_120"></lang-string></span></div>
	</div>
	<button type="button" class="btn btn-secondary" @click="state.close_modal()"><lang-string lang-id="MOD_MP_BUTTON_CLOSE"></lang-string></button>
</template>
<template id="template-mp-chat-message-actions-modal">
	<div class="mp-chat-modal-actions">
		<button type="button" class="btn btn-primary" @click="state.copy_chat_message()"><lang-string lang-id="MOD_MP_CHAT_COPY"></lang-string></button>
		<button type="button" class="btn btn-outline-danger" @click="state.show_chat_message_delete_confirmation()"><lang-string lang-id="MOD_MP_CHAT_DELETE_MESSAGE"></lang-string></button>
	</div>
	<div id="mp-modal-error" class="d-none text-danger mt-2"></div>
	<button type="button" class="btn btn-secondary mt-3" @click="state.close_modal()"><lang-string lang-id="MOD_MP_BUTTON_CANCEL"></lang-string></button>
</template>
<template id="template-mp-chat-message-delete-confirm-modal">
	<div class="mp-modal-text">
		<div class="font-w600"><lang-string lang-id="MOD_MP_CHAT_DELETE_MESSAGE_CONFIRM_TITLE"></lang-string></div>
		<div><lang-string lang-id="MOD_MP_CHAT_DELETE_MESSAGE_CONFIRM_INFO"></lang-string></div>
		<span id="mp-modal-error" class="d-none text-danger"></span>
	</div>
	<button type="button" class="btn btn-danger" @click="state.delete_chat_message($event)">
		<div class="spinner-border spinner-border-sm text-primary mr-2 d-none" role="status"></div>
		<lang-string lang-id="MOD_MP_CHAT_DELETE_MESSAGE"></lang-string>
	</button>
	<button type="button" class="btn btn-secondary" @click="state.close_modal()"><lang-string lang-id="MOD_MP_BUTTON_CANCEL"></lang-string></button>
</template>
<template id="template-mp-chat-actions-modal">
	<div class="mp-chat-modal-actions">
		<button type="button" class="btn btn-secondary" @click="state.show_chat_block_confirmation()">
			{{ state.get_chat_block_label() }}
		</button>
		<button type="button" class="btn btn-outline-danger" @click="state.show_chat_delete_confirmation()">
			<lang-string lang-id="MOD_MP_CHAT_DELETE_CONVERSATION"></lang-string>
		</button>
	</div>
