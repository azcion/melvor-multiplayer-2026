<template id="template-mp-account-options">
	<div id="mp-account-options">
		<template v-if="state.is_connected">
			<h5 class="dropdown-header text-warning">
				<lang-string lang-id="MOD_MP_MENU_HEADER"></lang-string>
			</h5>
			<a class="dropdown-item pointer-enabled" @click.stop="state.show_options_modal()">
				<img class="skill-icon-xxs" :src="state.get_avatar_icon(state.profile_icon)"/>
				<lang-string lang-id="MOD_MP_MENU_OPTIONS"></lang-string>
			</a>
		</template>
		<a class="dropdown-item pointer-enabled" v-show="!state.is_connected" @click.stop="state.open_identity_bootstrap()">
			<lang-string lang-id="MOD_MP_IDENTITY_CONNECT_TITLE"></lang-string>
		</a>
	</div>
</template>
<template id="template-mp-account-recovery-modal">
	<p class="mp-modal-text"><lang-string lang-id="MOD_MP_ACCOUNT_RECOVERY_NOTICE"></lang-string></p>
	<p class="text-break">{{ state.account_recovery_server }}</p>
	<p v-if="state.account_recovery_enrolling"><lang-string lang-id="MOD_MP_ACCOUNT_RECOVERY_ENROLL_INFO"></lang-string></p>
	<label class="d-block"><input type="checkbox" v-model="state.account_recovery_consent" :disabled="state.account_recovery_busy"> <lang-string lang-id="MOD_MP_ACCOUNT_RECOVERY_CONSENT"></lang-string></label>
	<div class="mp-account-recovery-list" v-if="!state.account_recovery_enrolling && state.account_recovery_candidates.length" @touchmove.stop>
		<div class="mb-3" v-for="identity in state.account_recovery_candidates" :key="identity.client_id">
			<label><input type="radio" name="mp-account-recovery-identity" :value="identity.client_id" v-model="state.account_recovery_selected" :disabled="state.account_recovery_busy"> <strong>{{ identity.display_name }}</strong></label>
			<div><lang-string lang-id="MOD_MP_ACCOUNT_RECOVERY_LAST_ACTIVE"></lang-string>: {{ state.account_recovery_last_active(identity.last_active_at) }}</div>
		</div>
	</div>
	<p v-if="state.account_recovery_loaded && !state.account_recovery_candidates.length"><lang-string lang-id="MOD_MP_ACCOUNT_RECOVERY_EMPTY"></lang-string></p>
	<button v-if="state.account_recovery_candidates.length" type="button" class="btn btn-primary mb-3" :disabled="state.account_recovery_busy || !state.account_recovery_consent || !state.account_recovery_selected" @click="state.run_account_recovery('connect', state.account_recovery_selected)"><lang-string lang-id="MOD_MP_IDENTITY_CONNECT_ACTION"></lang-string></button>
	<p role="status">{{ state.account_recovery_message }}</p>
	<button type="button" class="btn btn-primary" :disabled="state.account_recovery_busy || !state.account_recovery_consent" @click="state.run_account_recovery(state.account_recovery_enrolling ? 'enroll' : 'list')"><lang-string :lang-id="state.account_recovery_enrolling ? 'MOD_MP_ACCOUNT_RECOVERY_ENABLE' : 'MOD_MP_ACCOUNT_RECOVERY_FIND'"></lang-string></button>
	<button v-if="state.account_recovery_enrolling" type="button" class="btn btn-warning" :disabled="state.account_recovery_busy" @click="state.run_account_recovery('disable')"><lang-string lang-id="MOD_MP_ACCOUNT_RECOVERY_DISABLE"></lang-string></button>
	<button v-if="!state.account_recovery_enrolling" type="button" class="btn btn-secondary" :disabled="state.account_recovery_busy" @click="state.open_identity_code_recovery()"><lang-string lang-id="MOD_MP_IDENTITY_CODE_LABEL"></lang-string></button>
	<button type="button" class="btn btn-secondary ml-2" @click="state.close_modal()"><lang-string lang-id="MOD_MP_BUTTON_CLOSE"></lang-string></button>
</template>
<template id="template-mp-identity-bootstrap-modal">
	<button v-if="state.account_recovery_available" type="button" class="btn btn-primary mb-3" @click="state.open_account_recovery()"><lang-string lang-id="MOD_MP_ACCOUNT_RECOVERY_FIND"></lang-string></button>
	<div class="mp-modal-text"><lang-string lang-id="MOD_MP_IDENTITY_CONNECT_INFO"></lang-string></div>
	<label for="mp-identity-recovery-input"><lang-string lang-id="MOD_MP_IDENTITY_CODE_LABEL"></lang-string></label>
	<textarea id="mp-identity-recovery-input" class="form-control mp-identity-code" v-model="state.identity_code" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
	<div class="text-danger my-2" role="alert">{{ state.identity_error }}</div>
	<button class="btn btn-primary my-2" :disabled="state.identity_bootstrap_busy || !state.identity_code.trim()" @click="state.connect_identity_code()"><lang-string lang-id="MOD_MP_IDENTITY_CONNECT_ACTION"></lang-string></button>
	<hr>
	<label class="d-block"><input type="checkbox" v-model="state.identity_create_confirmed"> <lang-string lang-id="MOD_MP_IDENTITY_CREATE_CONFIRM"></lang-string></label>
	<button class="btn btn-warning" :disabled="state.identity_bootstrap_busy || !state.identity_create_confirmed" @click="state.create_multiplayer_identity()"><lang-string lang-id="MOD_MP_IDENTITY_CREATE_ACTION"></lang-string></button>
	<button class="btn btn-secondary ml-2" :disabled="state.identity_bootstrap_busy" @click="state.close_modal()"><lang-string lang-id="MOD_MP_BUTTON_CLOSE"></lang-string></button>
</template>
<template id="template-mp-identity-backup-modal">
	<div class="mp-modal-text"><lang-string lang-id="MOD_MP_IDENTITY_BACKUP_INFO"></lang-string></div>
	<label for="mp-identity-recovery-output"><lang-string lang-id="MOD_MP_IDENTITY_CODE_LABEL"></lang-string></label>
	<textarea id="mp-identity-recovery-output" class="form-control mp-identity-code" :value="state.identity_code" readonly autocomplete="off" spellcheck="false"></textarea>
</template>
<template id="template-mp-social-mode-choice-modal">
	<div class="mp-social-mode-choice">
		<div class="mp-social-mode-subtitle"><lang-string :lang-id="state.social_mode_enforcement ? 'MOD_MP_SOCIAL_MODE_ENFORCED_INFO' : 'MOD_MP_SOCIAL_MODE_SUBTITLE'"></lang-string></div>
		<div class="mp-social-mode-options">
			<div class="mp-social-mode-card mp-social-mode-card-full" v-if="!state.social_mode_enforcement">
				<h3><lang-string lang-id="MOD_MP_SOCIAL_MODE_FULL"></lang-string></h3>
				<div class="mp-social-mode-description">
					<div><lang-string lang-id="MOD_MP_SOCIAL_MODE_FULL_INFO"></lang-string></div>
					<div><lang-string lang-id="MOD_MP_SOCIAL_MODE_FULL_DETAIL"></lang-string></div>
				</div>
				<button type="button" class="btn mp-social-mode-button" @click="state.choose_social_mode('full')">
					<lang-string lang-id="MOD_MP_SOCIAL_MODE_CHOOSE"></lang-string>
				</button>
			</div>
			<div class="mp-social-mode-card mp-social-mode-card-social">
				<h3><lang-string lang-id="MOD_MP_SOCIAL_MODE_SOCIAL"></lang-string></h3>
				<div class="mp-social-mode-description">
					<div><lang-string lang-id="MOD_MP_SOCIAL_MODE_SOCIAL_INFO"></lang-string></div>
					<div><lang-string lang-id="MOD_MP_SOCIAL_MODE_SOCIAL_DETAIL"></lang-string></div>
				</div>
				<button type="button" class="btn mp-social-mode-button" @click="state.choose_social_mode('social')">
					<lang-string lang-id="MOD_MP_SOCIAL_MODE_CHOOSE"></lang-string>
				</button>
			</div>
		</div>
	</div>
</template>
<template id="template-mp-expedition-page">
	<div class="content d-none" id="mp-expedition-page">
		<section class="mp-expedition-shell" :aria-label="getLangString('MOD_MP_PAGE_EXPEDITION')">
			<p class="mp-expedition-message" v-if="state.expedition_loading && !state.expedition_state && !state.expedition_personal"><lang-string lang-id="MOD_MP_EXPEDITION_UI_LOADING_EXPEDITION"></lang-string></p>
			<div class="mp-expedition-panel mp-expedition-notice" v-if="state.expedition_pending_report && state.expedition_report_notice_visible">
				<p><lang-string lang-id="MOD_MP_EXPEDITION_UI_A_WORK_REPORT_IS_WAITING_FOR_SERVER_CONFIRMATION_THE_EXACT_CAPTURED_REPORT_"></lang-string></p>
				<button type="button" class="mp-expedition-button" :disabled="state.expedition_action_pending" @click="state.retry_expedition_report()"><lang-string lang-id="MOD_MP_EXPEDITION_UI_RETRY_SAVED_REPORT"></lang-string></button>
			</div>
			<div class="mp-expedition-panel mp-expedition-notice" v-if="!state.expedition_pending_report && (state.expedition_state?.tracking?.pending_boundary_at || state.expedition_personal?.tracking?.pending_boundary_at)">
				<p><lang-string lang-id="MOD_MP_EXPEDITION_UI_THE_ORIGINAL_WORK_INTERVAL_IS_AWAITING_A_BOUNDARY_SNAPSHOT_TRACKING_ACTIONS"></lang-string></p>
			</div>
			<div id="mp-expedition-hero" v-show="!state.expedition_has_ended(state.expedition_state?.expedition)">
				<div class="mp-expedition-panel" :class="{ 'mp-expedition-chamber-card': state.expedition_state?.expedition?.status === 'registration' || state.expedition_state?.expedition?.chamber }">
					<div class="mp-expedition-chamber-art-frame" v-if="state.expedition_state?.expedition?.status === 'registration' || state.expedition_state?.expedition?.chamber" :class="{ 'mp-expedition-rift-snow': ((state.expedition_state?.expedition?.chamber?.preparation ? 'entrance' : state.expedition_state?.expedition?.chamber?.id) ?? 'entrance') === 'entrance' }" aria-hidden="true">
						<img class="mp-expedition-chamber-art" :data-chamber-id="(state.expedition_state?.expedition?.chamber?.preparation ? 'entrance' : state.expedition_state?.expedition?.chamber?.id) ?? 'entrance'" :src="state.expedition_chamber_art_url((state.expedition_state?.expedition?.chamber?.preparation ? 'entrance' : state.expedition_state?.expedition?.chamber?.id) ?? 'entrance')" alt="" />
						<mp-expedition-snow v-if="((state.expedition_state?.expedition?.chamber?.preparation ? 'entrance' : state.expedition_state?.expedition?.chamber?.id) ?? 'entrance') === 'entrance'"></mp-expedition-snow>
						<mp-expedition-crystals v-if="state.expedition_state?.expedition?.chamber?.id === 'prismatic_descent'"></mp-expedition-crystals>
						<mp-expedition-haze v-if="state.expedition_state?.expedition?.chamber?.id === 'glassroot_terraces'"></mp-expedition-haze>
						<mp-expedition-observatory v-if="state.expedition_state?.expedition?.chamber?.id === 'buried_observatory'"></mp-expedition-observatory>
						<mp-expedition-orrery v-if="state.expedition_state?.expedition?.chamber?.id === 'prismatic_orrery'"></mp-expedition-orrery>
						<mp-expedition-voidwatch v-if="state.expedition_state?.expedition?.chamber?.id === 'voidwatch_threshold'"></mp-expedition-voidwatch>
						<mp-expedition-drowned-cloister v-if="state.expedition_state?.expedition?.chamber?.id === 'drowned_cloister'"></mp-expedition-drowned-cloister>
						<mp-expedition-rootforge-passage v-if="state.expedition_state?.expedition?.chamber?.id === 'rootforge_passage'"></mp-expedition-rootforge-passage>
						<mp-expedition-tideworn-crypts v-if="state.expedition_state?.expedition?.chamber?.id === 'tideworn_crypts'"></mp-expedition-tideworn-crypts>
						<mp-expedition-embervein-machinery v-if="state.expedition_state?.expedition?.chamber?.id === 'embervein_machinery'"></mp-expedition-embervein-machinery>
						<mp-expedition-mossbound-reliquary v-if="state.expedition_state?.expedition?.chamber?.id === 'mossbound_reliquary'"></mp-expedition-mossbound-reliquary>
						<mp-expedition-hollow-star v-if="state.expedition_state?.expedition?.chamber?.id === 'hollow_star'"></mp-expedition-hollow-star>
					</div>
					<div class="mp-expedition-chamber-copy">
						<h2 v-if="state.expedition_state?.expedition?.status === 'registration' || state.expedition_state?.expedition?.chamber" :class="{ 'mp-expedition-chamber-title': ((state.expedition_state?.expedition?.chamber?.preparation ? 'entrance' : state.expedition_state?.expedition?.chamber?.id) ?? 'entrance') === 'entrance' }">{{ state.expedition_state?.expedition?.status === 'registration' ? getLangString('MOD_MP_EXPEDITION_UI_THE_RIFT') : state.expedition_display_label(state.expedition_state?.expedition?.chamber?.label) }}</h2>
						<p v-if="state.expedition_state?.expedition?.status === 'registration'"><lang-string lang-id="MOD_MP_EXPEDITION_UI_GATHERING_FOR_THE_EXPEDITION"></lang-string></p>
						<p v-if="state.expedition_state?.expedition?.status === 'registration'"><strong>{{ state.expedition_state?.expedition?.registered_count }}</strong> <lang-string lang-id="MOD_MP_EXPEDITION_UI_REGISTERED"></lang-string></p>
						<p v-if="state.expedition_state?.expedition?.chamber && !state.expedition_state?.expedition?.chamber?.preparation">{{ state.expedition_text(state.expedition_state?.expedition?.chamber?.participant_count === 1 ? 'MOD_MP_EXPEDITION_PARTICIPANT_AT_ARRIVAL' : 'MOD_MP_EXPEDITION_PARTICIPANTS_AT_ARRIVAL', state.expedition_state?.expedition?.chamber?.participant_count) }}</p>
						<p class="mp-expedition-points"><lang-string lang-id="MOD_MP_EXPEDITION_UI_YOUR_EP"></lang-string> <strong>{{ state.format_ep(state.expedition_state?.points_micros ?? state.expedition_personal?.points_micros) }}</strong></p>
						<button type="button" class="mp-expedition-button" v-if="state.expedition_state?.expedition?.chamber && !state.expedition_state?.expedition?.registered" :disabled="state.expedition_action_pending" @click="state.register_expedition()"><lang-string lang-id="MOD_MP_EXPEDITION_UI_REGISTER_TO_WORK"></lang-string></button>
					</div>
				</div>
				<div class="mp-expedition-panel mp-expedition-tracking" v-if="state.expedition_state?.tracking && state.expedition_state?.tracking?.source !== 'equipment' && state.expedition_state?.tracking?.visit_id === state.expedition_state?.expedition?.chamber?.visit_id">
					<div class="mp-expedition-tracking-copy">
						<i class="fa fa-crosshairs" aria-hidden="true"></i>
						<div><strong>{{ state.expedition_text('MOD_MP_EXPEDITION_TRACKING_TITLE', state.expedition_tracking_title(state.expedition_state?.expedition?.chamber, state.expedition_state?.tracking)) }}</strong><small>{{ state.expedition_text('MOD_MP_EXPEDITION_STARTED_AGO', state.expedition_time_since(state.expedition_state?.tracking?.started_at)) }}</small></div>
					</div>
					<div class="mp-expedition-actions"><div class="mp-expedition-available" v-if="state.expedition_state?.tracking?.reward_remaining_ms != null"><lang-string lang-id="MOD_MP_EXPEDITION_AVAILABLE_TO_EARN"></lang-string><strong>{{ state.format_ep(Math.floor((state.expedition_state?.tracking?.reward_remaining_ms ?? 0) * 1000000 / 3600000)) }} EP</strong></div><button type="button" class="mp-expedition-button" :disabled="state.expedition_action_pending || state.expedition_pending_report || state.expedition_check_in_cooldown_until > 0" @click="state.submit_expedition_work('check-in')"><lang-string lang-id="MOD_MP_EXPEDITION_UI_CHECK_IN"></lang-string></button></div>
				</div>
				<div v-show="state.equipment_tracking()?.source === 'equipment'" class="mp-expedition-panel mp-expedition-tracking mp-equipment-tracking">
					<div class="mp-expedition-tracking-copy">
						<i class="fa fa-crosshairs" aria-hidden="true"></i>
						<div><strong>{{ state.expedition_text('MOD_MP_EXPEDITION_TRACKING_TITLE', state.equipment_task_name({ action_id: state.equipment_tracking()?.task_id?.split('|')[1] })) }}</strong><small>{{ state.expedition_text('MOD_MP_EXPEDITION_STARTED_AGO', state.expedition_time_since(state.equipment_tracking()?.started_at)) }}</small></div>
					</div>
					<div class="mp-expedition-actions"><button type="button" class="mp-expedition-button" :disabled="state.expedition_action_pending || state.expedition_pending_report" @click="state.equipment_action('check-in')"><lang-string lang-id="MOD_MP_EXPEDITION_UI_CHECK_IN"></lang-string></button></div>
				</div>
			</div>
			<div id="mp-expedition-chamber-view">
				<div class="mp-equipment-tabs mp-combat-page-tabs mp-expedition-page-tabs" role="tablist" :aria-label="getLangString('MOD_MP_EQUIPMENT_WORK_VIEWS')">
					<button type="button" class="btn mp-expedition-button" role="tab" id="mp-chamber-work-tab" aria-controls="mp-chamber-work" :aria-selected="state.expedition_work_tab === 'chamber'" @click="state.expedition_work_tab = 'chamber'"><lang-string lang-id="MOD_MP_EQUIPMENT_CHAMBER_TASKS"></lang-string></button>
					<button type="button" class="btn mp-expedition-button" role="tab" id="mp-expedition-journey-tab" aria-controls="mp-expedition-journey-view" :aria-selected="state.expedition_work_tab === 'journey'" @click="state.expedition_work_tab = 'journey'"><lang-string lang-id="MOD_MP_EXPEDITION_UI_JOURNEY"></lang-string><span class="badge mp-expedition-vote-badge" v-if="state.expedition_needs_vote()"><lang-string lang-id="MOD_MP_VOTE_BADGE"></lang-string></span></button>
					<button type="button" class="btn mp-expedition-button" role="tab" id="mp-equipment-work-tab" aria-controls="mp-equipment-work" :aria-selected="state.expedition_work_tab === 'equipment'" @click="state.expedition_work_tab = 'equipment'"><lang-string lang-id="MOD_MP_EQUIPMENT_PROJECTS"></lang-string></button>
				</div>
				<div id="mp-equipment-work" role="tabpanel" aria-labelledby="mp-equipment-work-tab" v-show="state.expedition_work_tab === 'equipment'">
					<p v-show="!state.combat.character"><lang-string lang-id="MOD_MP_EQUIPMENT_CREATE_FIRST"></lang-string></p>
					<div class="mp-project-grid" v-show="state.combat.character">
						<section class="mp-expedition-panel">
							<h3><lang-string lang-id="MOD_MP_EQUIPMENT_CATALOG"></lang-string></h3>
							<div v-for="category in state.equipment_project_categories()" :key="category.id" class="mp-equipment-category">
								<h4>{{ category.name }}</h4>
								<div class="mp-equipment-project-icons" role="group" :aria-label="category.name">
									<button v-for="project in category.items" :key="project.item_id" type="button" class="mp-equipment-project-icon" :disabled="!state.combat_tutorial_access('project', project.item_id)" :class="{ 'mp-tutorial-highlight': state.combat_tutorial_highlight('project', project.item_id), 'mp-equipment-project-ready': state.equipment_project_can_start(project), 'mp-equipment-project-complete': state.equipment_project_completed(project.item_id), 'mp-equipment-project-active': state.equipment_project_started(project.item_id) }" :title="state.equipment_project_title(project)" :aria-label="state.equipment_project_title(project)" :aria-pressed="state.equipment_selected.project?.id === project.item_id" @click="state.equipment_select('project', 'project', project.item_id)">
										<img :src="state.get_item_icon(project.item_id)" alt="" width="40" height="40">
										<i v-if="!state.combat_tutorial_access('project', project.item_id)" class="fa fa-lock mp-equipment-project-lock" aria-hidden="true"></i>
										<i v-else-if="state.equipment_project_completed(project.item_id)" class="fa fa-check mp-equipment-project-status" aria-hidden="true"></i>
										<i v-else-if="state.equipment_project_started(project.item_id)" class="fa fa-hourglass-half mp-equipment-project-status" aria-hidden="true"></i>
									</button>
								</div>
							</div>
						</section>
						<section class="mp-expedition-panel">
							<h3><lang-string lang-id="MOD_MP_EQUIPMENT_PERSONAL_WORK"></lang-string></h3>
			<section class="mp-combat-panel mp-tutorial-guide" v-if="state.combat_tutorial_guide()" :aria-label="state.combat_tutorial_heading()">
				<div class="mp-combat-panel-body"><strong>{{ state.combat_tutorial_heading() }}</strong>
				<p role="status">{{ state.combat_tutorial_guide()?.text }}</p>
				<button v-if="state.combat.tutorial?.skip_ep_micros != null" type="button" class="btn btn-sm btn-outline-secondary" :disabled="!state.combat_tutorial_skip_ready()" @click="state.combat_tutorial_skip_preview()"><lang-string lang-id="MOD_MP_COMBAT_TUTORIAL_SKIP"></lang-string></button></div>
			</section>
							<p v-show="!state.equipment_model()?.project"><lang-string lang-id="MOD_MP_EQUIPMENT_NO_PROJECT"></lang-string></p>
							<header class="mp-equipment-item-heading" v-for="project in [state.equipment_model()?.project].filter(Boolean)" :key="project.item_id"><img :src="state.get_item_icon(project.item_id)" alt="" width="80" height="80"><div><h4>{{ state.equipment_project_name(project) }}</h4><button type="button" class="btn btn-sm btn-outline-danger mb-3" v-show="state.equipment_model()?.project" :disabled="!state.equipment_cancel_ready()" @click="state.equipment_cancel_preview()"><lang-string lang-id="MOD_MP_EQUIPMENT_CANCEL_PROJECT"></lang-string></button></div></header>
							<div v-for="(tasks, index) in state.equipment_model()?.project?.stages || []" :key="index" class="mp-equipment-stage">
								<h4>{{ state.equipment_stage_name(index) }}</h4>
								<article v-for="task in tasks" :key="task.task_id" class="mp-expedition-task mp-equipment-task" :class="{ 'mp-expedition-task-self': state.equipment_tracking()?.source === 'equipment' && state.equipment_tracking()?.task_id === task.task_id, 'mp-tutorial-highlight': state.combat_tutorial_highlight('work') && task.available && task.player_ms < task.target_ms, 'mp-equipment-locked': !task.available && task.player_ms < task.target_ms }">
									<div class="mp-equipment-item"><img :src="state.expedition_work_icon(task.skill_id)" alt="" width="24" height="24"><strong>{{ state.equipment_task_name(task) }}</strong></div>
									<progress :value="task.player_ms" :max="task.target_ms" :aria-label="state.equipment_task_name(task)"></progress><small>{{ state.equipment_duration(task.player_ms) }} / {{ state.equipment_duration(task.target_ms) }}</small>
									<button v-if="state.can_open_chat_feature(task.skill_id)" type="button" class="mp-equipment-task-link" :aria-label="state.equipment_task_name(task)" @click="state.open_chat_feature(task.skill_id)"></button>
								</article>
							</div>
						</section>
					</div>
					<details class="mp-expedition-panel mp-expedition-debug-controls" v-if="state.combat.debug_enabled || state.expedition_state?.debug_enabled">
						<summary><lang-string lang-id="MOD_MP_EXPEDITION_UI_TEST_CONTROLS"></lang-string></summary>
						<p><lang-string lang-id="MOD_MP_EQUIPMENT_TEST_CONTROLS_INFO"></lang-string></p>
						<button type="button" class="mp-expedition-button" :disabled="state.combat.inventory_busy || state.expedition_loading" @click="state.equipment_refresh()"><lang-string lang-id="MOD_MP_EXPEDITION_UI_REFRESH"></lang-string></button>
						<div v-if="state.combat.debug_enabled && state.equipment_model()?.project">
							<button type="button" class="mp-expedition-button" v-for="task in (state.equipment_model()?.project?.stages || []).flat().filter(task => task.available && task.player_ms < task.target_ms)" :key="task.task_id" :disabled="!state.equipment_debug_ready()" @click="state.equipment_debug_preview(task)">{{ state.expedition_text('MOD_MP_EXPEDITION_COMPLETE_FOR_TEST', state.equipment_task_name(task)) }}</button>

						<div><span><lang-string lang-id="MOD_MP_RAID_TIME"></lang-string></span><strong>{{ state.raid?.active ? state.format_raid_time(state.raid?.expires_at) : getLangString('MOD_MP_RAID_ENDED') }}</strong></div>

						<label v-for="option in state.announcement_audience_choices.filter(option => state.selected_chat_conversation?.conversation_kind === 'announcements' && state.selected_chat_conversation?.announcement_audiences?.includes(option.id))" :key="option.id"><input type="checkbox" :checked="state.chat_announcement_audience === option.id" @change="state.chat_announcement_audience = $event.target.checked ? option.id : ''" :disabled="state.chat_sending"> <lang-string :lang-id="option.label"></lang-string></label>

								<button type="button" class="btn btn-secondary mp-chat-highlight" v-if="state.chat_can_highlight" :aria-pressed="!!state.get_chat_draft_highlight()" @mousedown.prevent @click="state.open_chat_highlight_picker()" :disabled="state.chat_sending"><lang-string lang-id="MOD_MP_CHAT_HIGHLIGHT"></lang-string></button>

							<div class="mp-chat-compose-submit">

									<mp-lang-string-f lang-id="MOD_MP_CHAT_BUDGET" :lang-arg-1="state.chat_budget.credits" :lang-arg-2="state.chat_budget.maximum"></mp-lang-string-f>

								<button type="submit" class="btn btn-primary" :disabled="!state.chat_can_send"><span class="spinner-border spinner-border-sm text-light mr-2" role="status" v-if="state.chat_sending"></span><lang-string lang-id="MOD_MP_CHAT_SEND"></lang-string></button>
							</div>
						</div>
					</form>
					<div class="text-danger mt-2" role="status" v-if="!state.is_chat_item_draft_valid()"><lang-string lang-id="MOD_MP_CHAT_ITEM_LIMIT"></lang-string></div>
					<div class="text-danger mt-2" v-if="state.chat_error && !state.service_status">{{ state.chat_error }}</div>
				</div>
			</div>
			<div class="mp-chat-reaction-picker" v-if="state.chat_reaction_picker_message_id !== null" :style="state.chat_reaction_picker_style">
				<button type="button" v-for="reaction in state.chat_reaction_choices" :key="reaction" @click="state.toggle_chat_reaction(state.get_chat_reaction_picker_message(), reaction)">{{ reaction }}</button>
				<button type="button" v-for="reaction in state.chat_reaction_random_choices" :key="reaction" @click="state.toggle_chat_reaction(state.get_chat_reaction_picker_message(), reaction)">{{ reaction }}</button>
			</div>
		</div>
	</div>
